async function fetchSetupProviders(modelId) {
  const list = document.getElementById('setupProviderList');
  const loading = document.getElementById('setupProviderLoading');
  // Check cache
  if (setupProvidersCache[modelId]) {
    renderSetupProviderList(setupProvidersCache[modelId]);
    return;
  }
  // free/auto don't have providers
  if (!modelId || modelId === 'openrouter/free' || modelId === 'openrouter/auto') {
    list.innerHTML = '<div class="provider-empty">This model uses OpenRouter auto-routing (no provider selection).</div>';
    return;
  }
  list.innerHTML = '';
  loading.style.display = '';
  try {
    const res = await fetch(`/api/openrouter/providers?model=${encodeURIComponent(modelId)}`);
    const data = await res.json();
    const providers = data.providers || [];
    setupProvidersCache[modelId] = providers;
    renderSetupProviderList(providers);
  } catch (e) {
    list.innerHTML = '<div class="provider-empty">Failed to load providers.</div>';
  } finally {
    loading.style.display = 'none';
  }
}

function renderSetupProviderList(providers) {
  const list = document.getElementById('setupProviderList');
  list.innerHTML = '';
  // "Default" option
  const defaultDiv = document.createElement('div');
  defaultDiv.className = 'provider-item' + (storyProviderSelection === '' ? ' selected' : '');
  defaultDiv.innerHTML = `
    <div class="provider-radio"></div>
    <span class="provider-name">Default (auto-route)</span>
    <span class="provider-stats">
      <span class="provider-stat" style="color:var(--text-meta);font-style:italic;">router picks cheapest fast provider</span>
    </span>`;
  defaultDiv.addEventListener('click', () => setupSelectProvider(''));
  list.appendChild(defaultDiv);

  if (!providers.length) return;

  // Divider
  const hr = document.createElement('hr');
  hr.className = 'provider-divider';
  list.appendChild(hr);

  providers.forEach(p => {
    const div = document.createElement('div');
    div.className = 'provider-item' + (storyProviderSelection === p.tag ? ' selected' : '');
    const tp = p.throughput_p50 != null ? `${p.throughput_p50} tok/s` : '—';
    const lat = p.latency_p50 != null ? `${(p.latency_p50 / 1000).toFixed(1)}s` : '—';
    const promptPrice = p.pricing.prompt != null ? `$${(p.pricing.prompt * 1e6).toFixed(2)}` : '—';
    const compPrice = p.pricing.completion != null ? `$${(p.pricing.completion * 1e6).toFixed(2)}` : '—';
    const uptime = p.uptime_last_1d != null ? `${p.uptime_last_1d.toFixed(1)}%` : '—';
    // Build DOM safely (provider data from our API, not user input)
    const radio = document.createElement('div');
    radio.className = 'provider-radio';
    const nameEl = document.createElement('span');
    nameEl.className = 'provider-name';
    nameEl.textContent = p.provider_name;
    const quantEl = document.createElement('span');
    quantEl.className = 'provider-quant';
    quantEl.textContent = p.quantization;
    const stats = document.createElement('span');
    stats.className = 'provider-stats';
    const discountTag = p.discount > 0 ? `<span class="model-ac-tag free">-${Math.round(p.discount * 100)}%</span>` : '';
    stats.innerHTML = `<span class="provider-stat throughput"><i class="fa-solid fa-gauge-high"></i> ${tp}</span><span class="provider-stat latency"><i class="fa-solid fa-clock"></i> ${lat}</span><span class="provider-stat price"><i class="fa-solid fa-coins"></i> ${promptPrice}/${compPrice} ${discountTag}</span><span class="provider-stat uptime"><i class="fa-solid fa-signal"></i> ${uptime}</span>`;
    div.appendChild(radio);
    div.appendChild(nameEl);
    div.appendChild(quantEl);
    div.appendChild(stats);
    div.addEventListener('click', () => setupSelectProvider(p.tag));
    list.appendChild(div);
  });
}

function setupSelectProvider(tag) {
  storyProviderSelection = tag;
  // Persist to DB
  fetch('/api/config', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ story_provider: tag }) }).catch(() => {});
  // Re-render list to update selection highlight
  const providers = setupProvidersCache[storyModelSelection] || [];
  renderSetupProviderList(providers);
  // Also highlight default
  const list = document.getElementById('setupProviderList');
  const items = list.querySelectorAll('.provider-item');
  if (items.length) {
    items[0].className = 'provider-item' + (tag === '' ? ' selected' : '');
  }
}

function setupGenerateStory() {
  const words = Array.from(selectedWords);
  if (!words.length) { showToast('Select at least one word first'); return; }
  const title = document.getElementById('setupTitle').value.trim() || null;
  const model = resolveStoryModel();
  const provider = storyProviderSelection || null;
  closeStorySetupModal();
  _doGenerateStory(words, title, model, provider);
}

async function _doGenerateStory(words, title, model, provider) {
  const btn = document.getElementById('generateStoryBtn');
  const status = document.getElementById('genStatus');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating...';
  status.style.display = 'none';
  try {
    const res = await fetch('/api/story', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ words, title, model, provider })
    });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      throw new Error(e.detail || 'Failed to generate story');
    }
    const story = await res.json();
    currentStoryId = story.id;
    // Follow this story's live text so the list shows a running char count.
    storyStreamState(story.id);
    subscribeStoryStream(story.id);
    status.style.display = 'block';
    status.textContent = `Story queued (#${story.id}) \u2014 generating in the background. Click it to watch it being written.`;
    loadStories();
    document.getElementById('storiesList').scrollIntoView({ behavior: 'smooth' });
  } catch (e) {
    alert('Error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Generate Story';
  }
}

function restoreStoryProvider() {
  storyProviderSelection = _serverConfig.story_provider || '';
}

// --- Generalized model-picker (used for the meanings picker modal) ---
// Mirrors the story-picker above but takes a `ctx` object so the same code
// can drive multiple pickers against the same ALL_MODELS catalogue.
// A ctx is { inputId, listId, customId, storageKey, customStorageKey,
//             selection, onChange? }.

const modelPickers = [];

// Re-render the picker if it is currently visible. The meanings picker uses
// an always-visible list (renderModelListFor); the inline story dropdown uses
// the old dropdown renderer (renderModelACFor). Pick based on the modal
// context the list lives in.
function _refreshACIfOpen(ctx) {
  const list = document.getElementById(ctx.listId);
  if (!list) return;
  const input = document.getElementById(ctx.inputId);
  if (list.closest('.model-picker-modal')) {
    renderModelListFor(ctx, input ? input.value : '');
  } else if (list.style.display !== 'none') {
    renderModelACFor(ctx, input ? input.value : '');
  }
}

// Render the always-visible list used by the meanings picker modal.
// The list is filtered by `query` (matches against the human name and the
// model id, case-insensitive) and is never hidden — it stays in the DOM
// between renders so scrolling position is preserved.
function renderModelListFor(ctx, query) {
  const list = document.getElementById(ctx.listId);
  const empty = document.getElementById('meaningsModelEmpty');
  if (!list) return;
  const q = (query || '').trim().toLowerCase();
  const matches = q
    ? ALL_MODELS.filter(m => m.label.toLowerCase().includes(q) || m.id.toLowerCase().includes(q))
    : ALL_MODELS.slice();

  list.innerHTML = '';

  if (modelsLoading && !ALL_MODELS.length) {
    const div = document.createElement('div');
    div.className = 'model-ac-item model-ac-pseudo';
    div.textContent = 'Loading models…';
    list.appendChild(div);
    if (empty) empty.style.display = 'none';
    return;
  }
  if (modelsError && !ALL_MODELS.length) {
    const div = document.createElement('div');
    div.className = 'model-ac-item model-ac-pseudo';
    div.textContent = '⚠ Failed to load models — click to retry';
    div.addEventListener('mousedown', (e) => { e.preventDefault(); retryLoadModels(); });
    list.appendChild(div);
    if (empty) empty.style.display = 'none';
    return;
  }

  if (!matches.length) {
    if (empty) empty.style.display = '';
    return;
  }
  if (empty) empty.style.display = 'none';

  matches.forEach(m => {
    const div = document.createElement('div');
    div.className = 'model-ac-item' + (m.id === ctx.selection ? ' selected' : '');
    div.dataset.id = m.id;
    const name = document.createElement('span');
    name.className = 'model-ac-name';
    name.textContent = m.label.split(' (')[0];
    div.appendChild(name);
    const idEl = document.createElement('span');
    idEl.className = 'model-ac-id';
    idEl.textContent = m.id;
    div.appendChild(idEl);
    const tags = document.createElement('span');
    tags.className = 'model-ac-tags';
    const free = m.price <= 0;
    const t = document.createElement('span');
    t.className = 'model-ac-tag' + (free ? ' free' : '');
    t.textContent = free
      ? 'free'
      : `$${m.pIn.toFixed(3)} in / $${m.pOut.toFixed(3)} out per 1M`;
    tags.appendChild(t);
    if (m.id === ctx.selection) {
      const ck = document.createElement('span');
      ck.className = 'model-ac-tag recommended';
      ck.textContent = '\u2713';
      ck.title = 'Currently selected';
      tags.appendChild(ck);
    }
    div.appendChild(tags);
    div.addEventListener('click', () => selectModelACFor(ctx, m.id));
    list.appendChild(div);
  });
}

// Re-render the autocomplete dropdown filtered by query. (Used for the
// inline story-model dropdown — the meanings picker uses renderModelListFor
// instead so its list is always visible.)
function renderModelACFor(ctx, query) {
  const list = document.getElementById(ctx.listId);
  const q = (query || '').trim().toLowerCase();
  let statusItems = [];
  if (modelsLoading) {
    statusItems = [{ id: '__loading__', label: 'Loading models…', pseudo: true }];
  } else if (modelsError && !ALL_MODELS.length) {
    statusItems = [{ id: '__retry__', label: '⚠ Failed to load models — click to retry', pseudo: true }];
  }
  const matches = ALL_MODELS.filter(m =>
    !q || m.label.toLowerCase().includes(q) || m.id.toLowerCase().includes(q)
  ).slice(0, 60);
  const items = [{ id: '', label: 'Default model' }, ...statusItems, ...matches, { id: '__custom__', label: 'Custom…' }];
  list.innerHTML = '';
  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'model-ac-item' + (it.pseudo ? ' model-ac-pseudo' : '') + (it.id === ctx.selection ? ' selected' : '');
    div.dataset.id = it.id;
    if (it.id && it.id !== '__custom__' && it.id !== '__loading__' && it.id !== '__retry__') {
      const m = ALL_MODELS.find(x => x.id === it.id);
      if (m) {
        const name = document.createElement('span');
        name.className = 'model-ac-name';
        name.textContent = m.label.split(' (')[0];
        div.appendChild(name);
        const idEl = document.createElement('span');
        idEl.className = 'model-ac-id';
        idEl.textContent = m.id;
        div.appendChild(idEl);
        const tags = document.createElement('span');
        tags.className = 'model-ac-tags';
        const free = m.price <= 0;
        const t = document.createElement('span');
        t.className = 'model-ac-tag' + (free ? ' free' : '');
        t.textContent = free
          ? 'free'
          : `$${m.pIn.toFixed(3)} in / $${m.pOut.toFixed(3)} out per 1M`;
        tags.appendChild(t);
        if (it.id === ctx.selection) {
          const t = document.createElement('span');
          t.className = 'model-ac-tag recommended';
          t.textContent = '\u2713';
          t.title = 'Currently selected';
          tags.appendChild(t);
        }
        div.appendChild(tags);
      } else {
        div.textContent = it.label;
      }
    } else {
      div.textContent = it.label;
    }
    if (it.id === '__retry__') {
      div.addEventListener('mousedown', (e) => { e.preventDefault(); retryLoadModels(); });
    } else if (!it.pseudo) {
      div.addEventListener('mousedown', (e) => { e.preventDefault(); selectModelACFor(ctx, it.id); });
    }
    div.addEventListener('mouseenter', () => {
      list.querySelectorAll('.model-ac-item').forEach(x => x.classList.remove('kb-active'));
      div.classList.add('kb-active');
    });
    list.appendChild(div);
  });
  list.style.display = items.length ? 'block' : 'none';
  if (list.parentElement && list.parentElement.classList.contains('model-picker-list-wrap')) {
    list.parentElement.style.display = items.length ? 'block' : 'none';
  }
}

function selectModelACFor(ctx, id) {
  if (id === '__loading__' || id === '__retry__') return;
  ctx.selection = id;
  // Persist to DB (single source of truth for all clients / WebSocket sync).
  const payload = {};
  if (ctx.storageKey === 'lastMeaningsModel') payload.meanings_model = id;
  else payload.story_model = id;
  fetch('/api/config', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) }).catch(() => {});
  const custom = document.getElementById(ctx.customId);
  if (id === '__custom__') {
    custom.value = '';
    custom.style.display = '';
  } else {
    custom.style.display = 'none';
  }
  if (typeof ctx.onChange === 'function') ctx.onChange();
  _syncModelInputFor(ctx);
  // If this ctx is the always-visible meanings list, refresh it in place so
  // the ✓ checkmark moves to the newly selected row, and update the Default
  // row's selected state. Otherwise (story picker) hide the dropdown.
  const list = document.getElementById(ctx.listId);
  if (list && list.closest('.model-picker-modal')) {
    const input = document.getElementById(ctx.inputId);
    renderModelListFor(ctx, input ? input.value : '');
    updateMeaningsDefaultRow();
  } else {
    _hideModelListFor(ctx);
  }
}

// Populate the "Default model" row with the actual default id (fetched from
// /api/config). If the catalogue already has the model, we show the human
// name and the free/paid tag; otherwise we fall back to the raw id.
let _meaningsDefaultId = null;
// Human-readable name + tooltip for OpenRouter's built-in router slugs
// (anything starting with `openrouter/` that isn't itself in the catalogue).
const _OPENROUTER_ROUTER_LABELS = {
  'openrouter/free': {
    name: 'Free models router',
    tag: 'free',
    title: 'OpenRouter auto-selects a free-tier model for each request',
  },
  'openrouter/auto': {
    name: 'Auto router (may use paid models)',
    tag: 'auto',
    title: 'OpenRouter picks any model per request; may incur charges',
  },
};
function _routerLabel(id) {
  return _OPENROUTER_ROUTER_LABELS[id] || null;
}
function _fillDefaultModelInfo() {
  const idEl = document.getElementById('meaningsDefaultId');
  const nameEl = document.getElementById('meaningsDefaultName');
  const tag = document.getElementById('meaningsDefaultTag');
  if (!idEl || !nameEl || !tag) return;
  const id = _meaningsDefaultId || '';
  idEl.textContent = id;
  const m = ALL_MODELS.find(x => x.id === id);
  const router = _routerLabel(id);
  if (m) {
    nameEl.textContent = m.label.split(' (')[0];
  } else if (router) {
    nameEl.textContent = router.name;
  } else if (id) {
    nameEl.textContent = 'Default (unknown model)';
  } else {
    nameEl.textContent = 'Default model';
  }
  tag.innerHTML = '';
  if (m) {
    const free = m.price <= 0;
    const t = document.createElement('span');
    t.className = 'model-ac-tag' + (free ? ' free' : '');
    t.textContent = free
      ? 'free'
      : `$${m.pIn.toFixed(3)} in / $${m.pOut.toFixed(3)} out per 1M`;
    tag.appendChild(t);
  } else if (router) {
    const t = document.createElement('span');
    t.className = 'model-ac-tag free';
    t.textContent = router.tag;
    t.title = router.title;
    tag.appendChild(t);
  } else if (id) {
    const t = document.createElement('span');
    t.className = 'model-ac-tag';
    t.textContent = 'fallback';
    t.title = 'Fallback openrouter/free';
    tag.appendChild(t);
  }
}

// Toggle the ✓/highlight on the dedicated "Default model" row, and rebuild
// the model details (name, id, free/paid tag) since ALL_MODELS may have
// just finished loading.
function updateMeaningsDefaultRow() {
  const row = document.getElementById('meaningsDefaultRow');
  if (!row) return;
  const isDefault = !meaningsCtx.selection;
  row.classList.toggle('selected', isDefault);
  const tag = document.getElementById('meaningsDefaultTag');
  // When the row is selected, prepend a ✓ tag (in addition to the
  // free/paid tag filled by _fillDefaultModelInfo). Otherwise just keep
  // the existing tags.
  if (tag) {
    let existing = tag.innerHTML;
    tag.innerHTML = '';
    if (isDefault) {
      const ck = document.createElement('span');
      ck.className = 'model-ac-tag recommended';
      ck.textContent = '\u2713';
      ck.title = 'Currently selected';
      tag.appendChild(ck);
    }
    // Re-append the price/free tag from a fresh lookup so the row stays
    // accurate after catalogue updates.
    if (_meaningsDefaultId) {
      const m = ALL_MODELS.find(x => x.id === _meaningsDefaultId);
      if (m) {
        const free = m.price <= 0;
        const t = document.createElement('span');
        t.className = 'model-ac-tag' + (free ? ' free' : '');
        t.textContent = free
          ? 'free'
          : `$${m.pIn.toFixed(3)} in / $${m.pOut.toFixed(3)} out per 1M`;
        tag.appendChild(t);
      } else {
        // Not in the catalogue — could be an OpenRouter router slug
        // (e.g. openrouter/free). Render its friendly tag.
        const router = _routerLabel(_meaningsDefaultId);
        if (router) {
          const t = document.createElement('span');
          t.className = 'model-ac-tag free';
          t.textContent = router.tag;
          t.title = router.title;
          tag.appendChild(t);
        }
      }
    }
  }
}

function _syncModelInputFor(ctx) {
  const input = document.getElementById(ctx.inputId);
  const custom = document.getElementById(ctx.customId);
  if (ctx.selection === '__custom__') {
    input.value = 'Custom…';
    custom.style.display = '';
  } else if (ctx.selection === '') {
    input.value = 'Default model';
    custom.style.display = 'none';
  } else {
    const m = ALL_MODELS.find(x => x.id === ctx.selection);
    input.value = m ? m.label : ctx.selection;
    custom.style.display = 'none';
  }
}

function resolveModelFor(ctx) {
  if (ctx.selection === '__custom__') {
    return document.getElementById(ctx.customId).value.trim() || null;
  }
  return ctx.selection || null;
}

function restoreModelFor(ctx) {
  const saved = ctx.storageKey === 'lastMeaningsModel'
    ? (_serverConfig.meanings_model || null)
    : (_serverConfig.story_model || null);
  if (saved) ctx.selection = saved;
  if (ctx.selection === '__custom__') {
    const customKey = ctx.storageKey + 'Custom';
    document.getElementById(ctx.customId).value = _serverConfig[customKey] || '';
  }
  _syncModelInputFor(ctx);
  if (typeof ctx.onChange === 'function') ctx.onChange();
}

const meaningsCtx = {

// Update the "Currently using" bar at the top of the picker modal.
// Resolves the active selection against ALL_MODELS / router labels so the
// human name appears in the chip, with the raw id shown underneath.
function updateMeaningsCurrentBar() {
  const nameEl = document.getElementById('meaningsCurrentName');
  const idEl = document.getElementById('meaningsCurrentId');

}

async function readStoryById(id, btn) {
  if (!btn) return;
  if (currentBtn === btn) { stopAudio(); hideStoryPlayer(); return; }
  const icon = btn.dataset.icon || btn.innerHTML;
  btn.dataset.icon = icon;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Loading audio...';
  try {
    const res = await fetch(`/api/stories/${id}`);
    const story = await res.json();
    let filename = story.audio_path;
    if (!filename) {
      const saveRes = await fetch('/api/tts/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: stripMarkdown(stripStoryLabels(story.content)), story_id: id })
      });
      if (!saveRes.ok) throw new Error('TTS failed');
      const data = await saveRes.json();
      if (data.filename) {
        filename = data.filename;
      } else if (data.status === 'generating') {
        // Heavy generation now runs in the background; the WebSocket will
        // tell us when it's ready and re-trigger playback.
        pendingStoryAudio = { id, btn };
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating 0%';
        return;
      } else {
        throw new Error('Unexpected TTS response');
      }
    }
    btn.disabled = false;
    playAudioFile('/audio/' + filename, btn, () => { loadStories(); hideStoryPlayer(); });
    showStoryPlayer();
    const audio = currentAudio;
    if (audio) {
      audio.loop = true;
      audio.playbackRate = parseFloat(document.getElementById('storyModalSpeed').value) || 1;
      const tick = () => {
        const seek = document.getElementById('storyModalSeek');
        const dur = audio.duration || 0;
        seek.max = dur;
        seek.value = audio.currentTime || 0;
        document.getElementById('storyModalTime').textContent = `${formatTime(audio.currentTime)} / ${formatTime(dur)}`;
      };
      audio.ontimeupdate = tick;
      audio.onloadedmetadata = tick;
      audio.onplay = () => { document.getElementById('storyModalPlayPause').innerHTML = '<i class="fa-solid fa-pause"></i>'; };
      audio.onpause = () => { document.getElementById('storyModalPlayPause').innerHTML = '<i class="fa-solid fa-play"></i>'; };
    }
  } catch (e) {
    btn.disabled = false;
    btn.innerHTML = icon;
    alert('TTS error: ' + e.message);
  }
}

async function playAudioFile(url, btn, onEnd) {
  stopAudio();
  const volume = parseFloat(document.getElementById('volumeSlider').value);
  const audio = new Audio(url);
  audio.volume = volume;
  currentAudio = audio;
  if (btn) { btn.innerHTML = '<i class="fa-solid fa-circle-stop"></i>'; currentBtn = btn; }
  audio.play();
  audio.onended = () => { if (!btn || currentBtn === btn) { stopAudio(); if (onEnd) onEnd(); } };
}

async function deleteStory(id) {
  if (!confirm('Delete this story? This also removes its saved audio.')) return;
  await fetch(`/api/stories/${id}`, { method: 'DELETE' });
  dropStoryStream(id);
  if (currentStoryId === id) {
    currentStoryId = null;
  }
  loadStories();
}

async function retryStory(id) {
  try {
    const res = await fetch(`/api/stories/${id}/retry`, { method: 'POST' });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      throw new Error(e.detail || 'Retry failed');
    }
    showToast(`Retrying story #${id}\u2026`);
    // Follow the retried story's live text too.
    storyStreamState(id);
    subscribeStoryStream(id);
  } catch (e) {
    alert('Error: ' + e.message);
  }
  loadStories();
}

async function cancelStory(id) {
  try {
    const res = await fetch(`/api/stories/${id}/cancel`, { method: 'POST' });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      throw new Error(e.detail || 'Cancel failed');
    }
    const data = await res.json().catch(() => ({}));
    dropStoryStream(id);
    if (data.aborted) {
      showToast(`Story #${id} cancelled.`);
    } else {
      showToast(`Story #${id} had already finished generating.`);
    }
  } catch (e) {
    alert('Error: ' + e.message);
  }
  loadStories();
}

async function loadStories(wordId) {
  let url = '/api/stories';
  if (wordId) url += `?word_id=${wordId}`;
  const res = await fetch(url);
  const stories = await res.json();
  const box = document.getElementById('storiesList');
  box.innerHTML = '';
  if (!stories.length) {
    box.innerHTML = '<p style="color:var(--text-meta);font-size:0.85em;">No stories yet. Use the generator above to create one.</p>';
    return;
  }
  stories.forEach(s => {
    const item = document.createElement('div');
    item.dataset.id = s.id;
    const isGenerating = s.status === 'generating';
    const isFailed = s.status === 'failed';
    item.className = 'story-list-item' + (isGenerating ? ' is-generating' : isFailed ? ' is-failed' : '');
    const titleBox = document.createElement('span');
    titleBox.className = 'story-list-title-box';
    const title = document.createElement('span');
    title.className = 'story-list-title';
    title.textContent = s.title || 'Untitled';
    titleBox.appendChild(title);
    if (isGenerating || isFailed) {
      const statusLine = document.createElement('span');
      statusLine.className = 'story-list-status-line';
      if (isGenerating) {
        const st = storyStreams.get(s.id);
        const tokens = st ? estimateTokens(st.text) : 0;
        statusLine.innerHTML = tokens > 0
          ? `<i class="fa-solid fa-spinner fa-spin"></i> Generating\u2026 \u2248${tokens.toLocaleString()} tokens`
          : '<i class="fa-solid fa-spinner fa-spin"></i> Generating\u2026';
        statusLine.title = 'Click the story to watch it being written.';
      } else {
        const errText = s.error || 'Generation failed';
        const warnIcon = document.createElement('i');
        warnIcon.className = 'fa-solid fa-triangle-exclamation';
        statusLine.appendChild(warnIcon);
        statusLine.appendChild(document.createTextNode(' ' + errText));
        statusLine.title = errText;
      }
      titleBox.appendChild(statusLine);
    } else if (s.model || s.cost != null || s.duration_ms != null || countStoryChars(s.content) > 0) {
      const metaBox = document.createElement('span');
      metaBox.className = 'story-list-meta';
      const add = (icon, text) => {
        const span = document.createElement('span');
        span.className = 'story-list-meta-line';
        if (icon) {
          const i = document.createElement('i');
          i.className = icon;
          span.appendChild(i);
        }
        span.appendChild(document.createTextNode(' ' + text));
        metaBox.appendChild(span);
      };
      const chars = countStoryChars(s.content);
      if (chars > 0) add('fa-solid fa-font', `${chars.toLocaleString()} chars`);
      if (s.model) add('fa-solid fa-robot', s.model.replace(/^.*\//, ''));
      if (s.cost != null) add('fa-solid fa-coins', s.cost > 0 ? `$${s.cost.toFixed(5)}` : 'free');
      const dur = formatDuration(s.duration_ms);
      if (dur) add('fa-solid fa-stopwatch', dur);
      titleBox.appendChild(metaBox);
    }
    const right = document.createElement('span');
    right.className = 'story-list-right';
    const date = document.createElement('span');
    date.className = 'story-list-date';
    date.textContent = formatDate(s.createdAt);
    const del = document.createElement('button');
    del.className = 'story-list-del';
    del.title = 'Delete story';
    del.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
    del.onclick = (e) => { e.stopPropagation(); deleteStory(s.id); };
    right.appendChild(date);
    if (isGenerating) {
      const cancel = document.createElement('button');
      cancel.className = 'story-list-cancel story-stop-icon';
      cancel.title = 'Stop generating';
      cancel.innerHTML = '<i class="fa-solid fa-stop"></i>';
      cancel.onclick = (e) => { e.stopPropagation(); cancelStory(s.id); };
      right.appendChild(cancel);
    }
    if (isFailed) {
      const retry = document.createElement('button');
      retry.className = 'story-list-retry';
      retry.title = 'Retry generation';
      retry.innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
      retry.onclick = (e) => { e.stopPropagation(); retryStory(s.id); };
      right.appendChild(retry);
    }
    right.appendChild(del);
    item.appendChild(titleBox);
    item.appendChild(right);
    // Generating stories are openable too — the modal shows the live preview.
    item.onclick = isFailed ? null : () => openStoryModal(s.id);
    box.appendChild(item);
  });
}

function switchToWordsView(word) {
  document.getElementById('storiesPanel').style.display = 'none';
  document.getElementById('wordGridContainer').style.display = '';
  document.body.classList.remove('stories-view');
  document.getElementById('viewToggleBtn').innerHTML = '<i class="fa-solid fa-book-open"></i> Stories';
  if (word) {
    document.getElementById('searchInput').value = word;
    applySearch();
  }
}

function openStoriesForWord(wordId) {
  document.getElementById('wordGridContainer').style.display = 'none';
  document.getElementById('storiesPanel').style.display = 'block';
  document.body.classList.add('stories-view');
  document.getElementById('viewToggleBtn').innerHTML = '<i class="fa-solid fa-book"></i> Words';
  loadStories(wordId);
  populateModelSelect();
}

document.addEventListener('DOMContentLoaded', () => {
    marked.setOptions({ breaks: true, gfm: true, sanitize: false });

    // Apply saved theme on load
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    document.getElementById('themeToggle').innerHTML = savedTheme === 'dark' ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';

    // Toggle handler
    document.getElementById('themeToggle').addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
        document.getElementById('themeToggle').innerHTML = next === 'dark' ? '<i class="fa-solid fa-moon"></i>' : '<i class="fa-solid fa-sun"></i>';
    });

    // --- Sort: select + ASC/DESC toggle (replaces 4 buttons) ---
    const sortSelect = document.getElementById('sortSelect');
    const sortOrderBtn = document.getElementById('sortOrderBtn');
    if (sortSelect) {
        const valid = ['updatedAt','createdAt','encounters','word','id'];
        if (valid.includes(currentSort)) sortSelect.value = currentSort;
        sortSelect.addEventListener('change', () => {
            fetchData(sortSelect.value, currentOrder);
        });
    }
    if (sortOrderBtn) {
        updateSortOrderBtn();
        sortOrderBtn.addEventListener('click', () => {
            const next = currentOrder === 'asc' ? 'desc' : 'asc';
            fetchData(currentSort, next);
        });
    }

    const volumeToggle = document.getElementById('volumeToggle');
    const volumePopup = document.getElementById('volumePopup');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeLabel = document.getElementById('volumeLabel');
    const storyModalVolume = document.getElementById('storyModalVolume');
    const storyModalVolLabel = document.getElementById('storyModalVolLabel');
    const storyModalVolBtn = document.getElementById('storyModalVolBtn');

    const savedVolume = localStorage.getItem('ttsVolume');
    if (savedVolume !== null) {
        volumeSlider.value = savedVolume;
        storyModalVolume.value = savedVolume;
    }
    let lastNonZeroVolume = Math.max(parseFloat(volumeSlider.value) || 1, 0.05);

    const volumeIconFor = (v) => {
        const pct = Math.round(v * 100);
        return pct === 0 ? '<i class="fa-solid fa-volume-xmark"></i>' : pct < 50 ? '<i class="fa-solid fa-volume-low"></i>' : '<i class="fa-solid fa-volume-high"></i>';
    };
    const updateVolumeUI = (v) => {
        const pct = Math.round(v * 100);
        volumeLabel.textContent = `${pct}%`;
        storyModalVolLabel.textContent = `${pct}%`;
        const icon = volumeIconFor(v);
        volumeToggle.innerHTML = icon;
        storyModalVolBtn.innerHTML = icon;
    };
    const applyVolume = (v) => {
        v = parseFloat(v);
        if (v > 0) lastNonZeroVolume = v;
        volumeSlider.value = v;
        storyModalVolume.value = v;
        updateVolumeUI(v);
        localStorage.setItem('ttsVolume', String(v));
        if (currentAudio) currentAudio.volume = v;
    };

    updateVolumeUI(parseFloat(volumeSlider.value));

    volumeToggle.addEventListener('click', () => volumePopup.classList.toggle('open'));
    volumeSlider.addEventListener('input', () => applyVolume(volumeSlider.value));
    storyModalVolume.addEventListener('input', () => applyVolume(storyModalVolume.value));
    storyModalVolBtn.addEventListener('click', () => {
        applyVolume(parseFloat(storyModalVolume.value) > 0 ? 0 : lastNonZeroVolume);
    });
    document.addEventListener('click', (e) => {
        if (!e.target.closest('.volume-control')) volumePopup.classList.remove('open');
    });

    document.getElementById('searchInput').addEventListener('input', applySearch);
    document.getElementById('newWordInput').addEventListener('keydown', e => { if (e.key === 'Enter') addWord(); });

    document.getElementById('closeStoryModalBtn').addEventListener('click', closeStoryModal);
    document.querySelectorAll('.modal-tab').forEach(t => t.onclick = () => {
      const tab = t.dataset.tab;
      document.querySelectorAll('.modal-tab').forEach(x => x.classList.toggle('active', x === t));
      document.getElementById('storyTabPanel').style.display = (tab === 'story') ? 'block' : 'none';
      document.getElementById('builtTabPanel').style.display = (tab === 'built') ? 'block' : 'none';
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && document.getElementById('storyModalOverlay').classList.contains('open')) closeStoryModal();
    });
    document.getElementById('storyModalReadBtn').addEventListener('click', (e) => {
        readStoryById(currentModalStoryId, e.currentTarget);
    });
    document.getElementById('storyModalPlayPause').addEventListener('click', () => {
        const a = currentAudio;
        if (!a) return;
        if (a.paused) a.play(); else a.pause();
    });
    document.getElementById('storyModalSeek').addEventListener('input', (e) => {
        if (currentAudio) currentAudio.currentTime = parseFloat(e.target.value);
    });
    document.getElementById('storyModalSpeed').addEventListener('change', (e) => {
        if (currentAudio) currentAudio.playbackRate = parseFloat(e.target.value);
    });
    document.getElementById('storyModalStop').addEventListener('click', () => {
        stopAudio();
        hideStoryPlayer();
    });

    // --- Stories feature wiring ---
    document.getElementById('viewToggleBtn').addEventListener('click', () => {
        const panel = document.getElementById('storiesPanel');
        const grid = document.getElementById('wordGridContainer');
        const btn = document.getElementById('viewToggleBtn');
        if (panel.style.display === 'none' || panel.style.display === '') {
            panel.style.display = 'block';
            grid.style.display = 'none';
            document.body.classList.add('stories-view');
            btn.innerHTML = '<i class="fa-solid fa-book"></i> Words';
            loadStories();
            populateModelSelect();
        } else {
            panel.style.display = 'none';
            grid.style.display = '';
            document.body.classList.remove('stories-view');
            btn.innerHTML = '<i class="fa-solid fa-book-open"></i> Stories';
        }
    });
    document.getElementById('applyFilterBtn').addEventListener('click', applyFilter);
    document.getElementById('clearFilterBtn').addEventListener('click', () => {
        document.getElementById('filterMin').value = '';
        document.getElementById('filterMax').value = '';
        document.getElementById('filterField').value = 'id';
        document.getElementById('filterDirection').value = 'desc';
        document.getElementById('filterResults').innerHTML = '';
        document.getElementById('selCount').textContent = '';
        selectedWords.clear();
        updateSelectToggleUI();
    });
    document.getElementById('storyModelCustom').addEventListener('blur', (e) => {
        const val = e.target.value.trim();
        if (val && storyModelSelection === '__custom__') {
            fetch('/api/config', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ story_model: val }) }).catch(() => {});
        }
    });
    const acInput = document.getElementById('storyModelInput');
    acInput.addEventListener('focus', () => { acInput.select(); renderModelAC(''); });
    acInput.addEventListener('input', () => renderModelAC(acInput.value));
    acInput.addEventListener('blur', () => {
        setTimeout(() => {
            document.getElementById('storyModelList').style.display = 'none';
            syncModelInputToSelection();
        }, 150);
    });
    acInput.addEventListener('keydown', (e) => {
        const list = document.getElementById('storyModelList');
        const items = Array.from(list.querySelectorAll('.model-ac-item'));
        let active = items.findIndex(i => i.classList.contains('kb-active'));
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (list.style.display === 'none') { renderModelAC(acInput.value); return; }
            const next = (active + 1) % items.length;
            items.forEach(i => i.classList.remove('kb-active'));
            items[next].classList.add('kb-active');
            acInput.value = items[next].textContent;
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            const prev = (active <= 0 ? items.length - 1 : active - 1);
            items.forEach(i => i.classList.remove('kb-active'));
            items[prev].classList.add('kb-active');
            acInput.value = items[prev].textContent;
        } else if (e.key === 'Enter') {
            if (list.style.display !== 'none' && items.length) {
                e.preventDefault();
                const target = (active >= 0 ? items[active] : items[0]);
                if (target.dataset.id === '__retry__') { retryLoadModels(); return; }
                selectModelAC(target.dataset.id);
            }
        } else if (e.key === 'Escape') {
            list.style.display = 'none';
            syncModelInputToSelection();
        }
    });
    populateModelSelect();
    document.getElementById('selectAllBtn').addEventListener('click', () => {
        document.querySelectorAll('#filterResults .filter-item').forEach(li => {
            selectedWords.add(li.dataset.word);
            li.querySelector('input').checked = true;
        });
        renderChips();
        updateSelectToggleUI();
    });
    document.getElementById('unselectAllBtn').addEventListener('click', () => {
        document.querySelectorAll('#filterResults .filter-item').forEach(li => {
            selectedWords.delete(li.dataset.word);
            li.querySelector('input').checked = false;
        });
        renderChips();
        updateSelectToggleUI();
    });
    function updateSelectToggleUI() {
        const selectBtn = document.getElementById('selectAllBtn');
        const unselectBtn = document.getElementById('unselectAllBtn');
        const allVisible = document.querySelectorAll('#filterResults .filter-item').length;
        const allSelected = document.querySelectorAll('#filterResults .filter-item input:checked').length;
        if (!allVisible) { selectBtn.style.display = ''; unselectBtn.style.display = 'none'; return; }
        if (allSelected === 0) {
            selectBtn.style.display = ''; unselectBtn.style.display = 'none';
        } else if (allSelected === allVisible) {
            selectBtn.style.display = 'none'; unselectBtn.style.display = '';
        } else {
            selectBtn.style.display = ''; unselectBtn.style.display = '';
        }
    }
    document.getElementById('generateStoryBtn').addEventListener('click', generateStory);

    // Story button on word cards -> open Stories panel filtered by that word.
    document.getElementById('wordGridContainer').addEventListener('click', (e) => {
        const btn = e.target.closest('.story-button');
        if (btn) openStoriesForWord(parseInt(btn.dataset.id));
    });

    // --- Meanings model picker modal wiring ---
    // Only show the picker controls if the active provider is openrouter
    // (the picker is meaningless for Gemini/Groq). Uses /api/config to find
    // out, and stashes the env-default id for the Default row.
    fetch('/api/config').then(r => r.json()).then(cfg => {
        _meaningsDefaultId = (cfg && cfg.meanings_model) || null;
        _serverConfig = cfg || {};
        _fillDefaultModelInfo();
        const isOpenRouter = cfg && cfg.ai_provider === 'openrouter';
        window.isOpenRouter = !!isOpenRouter;
        const toolbarBtn = document.getElementById('meaningsModelToolbarBtn');
        if (isOpenRouter) {
            if (toolbarBtn) toolbarBtn.style.display = '';
            updateMeaningsModelButtonTitle();
        }
        // Re-restore models now that DB config is available (handles race
        // with populateModelSelect which may have loaded before config).
        if (typeof restoreModelFor === 'function') {
            for (const ctx of (typeof modelPickers !== 'undefined' ? modelPickers : [])) {
                restoreModelFor(ctx);
            }
        }
        if (typeof restoreStoryModel === 'function') restoreStoryModel();
        if (typeof restoreStoryProvider === 'function') restoreStoryProvider();
    }).catch(() => {});

    // The meanings picker uses an always-visible list filtered by the input,
    // so wiring is just: live-filter on input, Escape to close the modal.
    const _meaningsInput = document.getElementById(meaningsCtx.inputId);
    if (_meaningsInput) {
        _meaningsInput.addEventListener('input', () => renderModelListFor(meaningsCtx, _meaningsInput.value));
        _meaningsInput.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') { e.stopPropagation(); closeMeaningsModelModal(); }
        });
    }
    document.getElementById('meaningsDefaultRow').addEventListener('click', () => {
        selectModelACFor(meaningsCtx, '');
    });
    document.getElementById('meaningsModelCustom').addEventListener('blur', (e) => {
        const val = e.target.value.trim();
        if (val && meaningsCtx.selection === '__custom__') {
            fetch('/api/config', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ meanings_model: val }) }).catch(() => {});
        }
    });
    document.getElementById('closeModelPickerBtn').addEventListener('click', closeMeaningsModelModal);
    document.getElementById('meaningsModelDoneBtn').addEventListener('click', closeMeaningsModelModal);
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && document.getElementById('modelPickerModalOverlay').classList.contains('open')) {
            closeMeaningsModelModal();
        }
    });
    // Click outside the modal box closes it.
    document.getElementById('modelPickerModalOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'modelPickerModalOverlay') closeMeaningsModelModal();
    });

    // --- Story Setup Modal wiring ---
    document.getElementById('setupCloseBtn').addEventListener('click', closeStorySetupModal);
    document.getElementById('setupCancelBtn').addEventListener('click', closeStorySetupModal);
    document.getElementById('setupGenerateBtn').addEventListener('click', setupGenerateStory);
    document.getElementById('setupChangeModelBtn').addEventListener('click', setupBackToModels);
    document.getElementById('storySetupModalOverlay').addEventListener('click', (e) => {
        if (e.target.id === 'storySetupModalOverlay') closeStorySetupModal();
    });
    const setupModelInput = document.getElementById('setupModelInput');
    setupModelInput.addEventListener('input', () => renderSetupModelList(setupModelInput.value));
    setupModelInput.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { closeStorySetupModal(); }
    });

    fetchData(currentSort, currentOrder);
    connectWebSocket();
});
