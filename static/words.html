<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Editable Word Grid</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root {
        --bg-page:        #f4f4f9;
        --bg-card:        #fff;
        --bg-hover:       #f9f9f9;
        --bg-meta:        #f7f7f7;
        --bg-editable:    #f9f9f9;
        --bg-editable-focus: #eef4ff;
        --bg-sort-btn:    #e0e0e0;
        --bg-word-count:  #e9ecef;

        --border-card:    #ddd;
        --border-input:   #ccc;
        --border-details: #eee;

        --text-primary:   #333;
        --text-secondary: #555;
        --text-meta:      #666;
        --text-heading:   #0056b3;

        --color-primary:  #007bff;
        --color-success:  #28a745;
        --color-success-hover: #218838;
        --color-success-disabled: #94d3a2;
        --color-danger:   #dc3545;

        --shadow-card:    rgba(0,0,0,0.07);
        --shadow-btn:     rgba(0,0,0,0.1);
        --shadow-search:  rgba(0,123,255,0.15);
        --shadow-add:     rgba(40,167,69,0.15);
    }

    [data-theme="dark"] {
        --bg-page:        #191D24; /* black0 */
        --bg-card:        #1E222A; /* black1 */
        --bg-hover:       #222630; /* black2 */
        --bg-meta:        #191D24; /* black0 */
        --bg-editable:    #222630; /* black2 */
        --bg-editable-focus: #242933; /* gray0 */
        --bg-sort-btn:    #2E3440; /* gray1 */
        --bg-word-count:  #2E3440; /* gray1 */

        --border-card:    #3B4252; /* gray2 */
        --border-input:   #434C5E; /* gray3 */
        --border-details: #2E3440; /* gray1 */

        --text-primary:   #D8DEE9; /* white1 */
        --text-secondary: #C0C8D8; /* white_alt */
        --text-meta:      #60728A; /* gray5 */
        --text-heading:   #81A1C1; /* blue1 */

        --shadow-card:    rgba(0,0,0,0.3);
        --shadow-btn:     rgba(0,0,0,0.3);
        --shadow-search:  rgba(129,161,193,0.2); /* blue1 */
        --shadow-add:     rgba(163,190,140,0.2); /* green */
    }

    body {
        font-family: 'Inter', sans-serif;
        margin: 0; /* Reset default browser margin */
        padding: 20px; /* Add padding for spacing from screen edges */
        background-color: var(--bg-page);
        color: var(--text-primary);
    }

    /* --- Controls at the top --- */
    .controls-container {
        margin-bottom: 20px; /* Space between controls and grid */
    }
    #sortControls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }
    .sort-btn {
        background: linear-gradient(#7c3aed, #7c3aed) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
        color: #fff;
    }
    .sort-btn.active {
        background: linear-gradient(#6d28d9, #6d28d9) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
        color: #fff;
        box-shadow: 0 2px 4px var(--shadow-btn);
    }
    [data-theme="dark"] .sort-btn {
        background: linear-gradient(#3b0764, #3b0764) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
    }
    [data-theme="dark"] .sort-btn.active {
        background: linear-gradient(#2e1065, #2e1065) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
    }
    #wordCount {
        display: inline-block;
        background-color: var(--bg-sort-btn);
        color: var(--text-primary);
        font-size: 0.8em;
        font-weight: 500;
        padding: 8px 12px;
        border-radius: 4px;
        align-self: center;
        white-space: nowrap;
        margin-left: auto;
    }
    #searchInput {
        padding: 7px 12px;
        border: 1px solid var(--border-input);
        border-radius: 4px;
        font-size: 0.8em;
        font-family: inherit;
        outline: none;
        min-width: 200px;
        transition: border-color 0.15s;
        background-color: var(--bg-card);
        color: var(--text-primary);
    }
    #searchInput:focus {
        border-color: var(--color-primary);
        box-shadow: 0 0 0 2px var(--shadow-search);
    }
    .sort-select {
        padding: 7px 8px;
        border: 1px solid var(--border-input);
        border-radius: 4px;
        font-size: 0.8em;
        font-family: inherit;
        background-color: var(--bg-card);
        color: var(--text-primary);
        outline: none;
        cursor: pointer;
    }
    .sort-select:focus { border-color: var(--color-primary); }
    .add-word-group {
        display: flex;
        gap: 0;
    }
    #newWordInput {
        padding: 7px 12px;
        border: 1px solid var(--border-input);
        border-right: none;
        border-radius: 4px 0 0 4px;
        font-size: 0.8em;
        font-family: inherit;
        outline: none;
        min-width: 160px;
        transition: border-color 0.15s;
        background-color: var(--bg-card);
        color: var(--text-primary);
    }
    #newWordInput:focus {
        border-color: var(--color-success);
        box-shadow: 0 0 0 2px var(--shadow-add);
    }
    #addWordBtn {
        background: linear-gradient(#7c3aed, #7c3aed) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
        color: white;
        border-radius: 0 4px 4px 0;
        padding: 7px 14px;
        font-size: 0.8em;
    }
    #addWordBtn:hover:not(:disabled) {
        background: linear-gradient(#6d28d9, #6d28d9) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
    }
    #addWordBtn:disabled {
        background: linear-gradient(#a78bfa, #a78bfa) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
        cursor: not-allowed;
    }
    [data-theme="dark"] #addWordBtn {
        background: linear-gradient(#3b0764, #3b0764) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
    }
    [data-theme="dark"] #addWordBtn:hover:not(:disabled) {
        background: linear-gradient(#2e1065, #2e1065) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
    }
    [data-theme="dark"] #addWordBtn:disabled {
        background: linear-gradient(#4c1d95, #4c1d95) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
    }

    #addWordToast {
        position: fixed;
        top: 24px;
        right: 24px;
        left: auto;
        transform: translateX(20px);
        background-color: var(--bg-card);
        color: var(--text-primary);
        border: 2px solid var(--color-primary);
        border-radius: 8px;
        padding: 12px 20px;
        font-size: 0.9em;
        font-weight: 500;
        box-shadow: 0 6px 20px var(--shadow-card);
        opacity: 0;
        transition: opacity 0.3s, transform 0.3s;
        pointer-events: none;
        z-index: 1000;
        white-space: nowrap;
    }
    #addWordToast.show {
        opacity: 1;
        transform: translateX(0);
    }

    /* Grid Container and Columns - Now Full Width */
    #wordGridContainer {
        display: flex;
        gap: 15px;
        align-items: flex-start;
    }
    .grid-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    /* Word Item Styling (Card) */
    .word-item {
        background-color: var(--bg-card);
        border: 1px solid var(--border-card);
        border-radius: 8px;
        box-shadow: 0 2px 5px var(--shadow-card);
        overflow: hidden;
    }
    .word-header {
        padding: 15px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1em;
        font-weight: 600;
        user-select: none;
    }
    .word-header:hover { background-color: var(--bg-hover); }
    .word-header .word-title { flex-grow: 0; user-select: text; cursor: text; margin-right: 4px; padding-right: 4px; margin-left: 6px; }
    .word-header .indicator { font-size: 1.2em; line-height: 1; color: var(--color-primary); width: 1em; text-align: center; flex-shrink: 0; }
    .freq-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 22px;
        height: 22px;
        border-radius: 11px;
        background: linear-gradient(#fff, #fff) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
        border: 2px solid transparent;
        color: #7c3aed;
        font-size: 0.72em;
        font-weight: 700;
        padding: 0 5px;
        margin-right: 8px;
        margin-left: auto;
        flex-shrink: 0;
    }
    [data-theme="dark"] .freq-badge {
        background: linear-gradient(#1a0533, #1a0533) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
        color: #c084fc;
    }
    .word-details {
        display: none;
        padding: 0 15px 15px 15px;
        border-top: 1px solid var(--border-details);
    }
    .detail-section { margin-bottom: 12px; }
    .detail-section .metadata {
        font-size: 0.75em;
        color: var(--text-meta);
        padding: 8px;
        background: var(--bg-meta);
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        gap: 2px;
        align-items: flex-start;
    }

    /* Editable and Rendered Content */
    .editable-content {
        padding: 8px;
        border: 1px solid var(--border-input);
        border-radius: 4px;
        background-color: var(--bg-editable);
        color: var(--text-primary);
        min-height: 40px;
        font-size: 0.8em;
    }
    .editable-content[contenteditable] {
        outline: 2px solid var(--color-primary);
        background-color: var(--bg-editable-focus);
    }
    .rendered p, .rendered ul, .rendered ol { margin-top: 0; margin-bottom: 0.5em; }
    .rendered ul, .rendered ol { padding-left: 20px; }

    /* Buttons */
    button {
        padding: 8px 12px;
        cursor: pointer;
        border: 2px solid transparent;
        border-radius: 4px;
        font-size: 0.8em;
        font-weight: 500;
        background: linear-gradient(#7c3aed, #7c3aed) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
        color: #fff;
    }
    [data-theme="dark"] button {
        background: linear-gradient(#3b0764, #3b0764) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
    }
    .delete-button {
        background: linear-gradient(#7c3aed, #7c3aed) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
        color: white;
        margin-top: 10px;
    }
    [data-theme="dark"] .delete-button {
        background: linear-gradient(#3b0764, #3b0764) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
    }
    .story-button {
        background: linear-gradient(#0e7490, #0e7490) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
        color: white;
        margin-top: 10px;
    }
    [data-theme="dark"] .story-button {
        background: linear-gradient(#164e63, #164e63) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
    }


    .section-header {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 15px 0 5px 0;
    }
    .section-header h4 {
        margin: 0;
        color: var(--text-heading);
        padding-bottom: 4px;
        font-size: 0.9em;
    }
    .listen-btn {
        background: none;
        border: none;
        padding: 0 4px;
        font-size: 0.85em;
        cursor: pointer;
        opacity: 0.5;
        color: var(--color-primary);
        line-height: 1;
    }
    .listen-btn:hover { opacity: 1; }

    .speak-btn {
        background: none;
        border: none;
        padding: 0 4px;
        font-size: 1em;
        cursor: pointer;
        line-height: 1;
        opacity: 0.55;
        flex-shrink: 0;
        color: var(--color-success);
    }
    .speak-btn:hover { opacity: 1; }

    .volume-control {
        position: relative;
    }
    #volumePopup {
        display: none;
        position: absolute;
        top: calc(100% + 8px);
        left: 50%;
        transform: translateX(-50%);
        background-color: var(--bg-card);
        border: 1px solid var(--border-card);
        border-radius: 8px;
        box-shadow: 0 4px 12px var(--shadow-card);
        padding: 12px 10px;
        z-index: 100;
    }
    #volumePopup.open { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    #volumeSlider {
        writing-mode: vertical-lr;
        direction: rtl;
        height: 90px;
        accent-color: var(--color-success);
        cursor: pointer;
    }
    #volumeLabel {
        font-size: 0.75em;
        color: var(--text-meta);
    }

    /* Responsive Design */
    @media (max-width: 650px) {
        body { padding: 10px; } /* Less padding on small screens */
        #wordGridContainer { flex-direction: column; }
        .grid-column { width:100%; }
    }

    /* Read Aloud Modal */
    .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.45);
        z-index: 2000;
        align-items: center;
        justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
        background-color: var(--bg-card);
        color: var(--text-primary);
        border: 1px solid var(--border-card);
        border-radius: 10px;
        box-shadow: 0 10px 30px var(--shadow-card);
        width: 90vw;
        height: 88vh;
        max-width: none;
        max-height: none;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border-details);
    }
    .modal-header h3 { margin: 0; font-size: 1em; color: var(--text-heading); }
    .modal-close {
        background: none;
        border: none;
        color: var(--text-meta);
        font-size: 1.4em;
        line-height: 1;
        cursor: pointer;
        padding: 0 4px;
    }
    .modal-close:hover { color: var(--text-primary); }
    .modal-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 12px 16px 16px 16px;
    }
    .modal-actions .modal-left { display: flex; gap: 8px; }
    #storyModalBody { padding: 0; }
    .modal-header, .modal-actions { flex-shrink: 0; }
    .modal-tabs { display: flex; gap: 4px; padding: 10px 16px 0 16px; border-bottom: 1px solid var(--border-details); flex-shrink: 0; }
    .modal-tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--text-meta); font: inherit; font-size: 0.9em; }
    .modal-tab.active { color: var(--text-heading); border-bottom-color: var(--color-primary); }
    .modal-tab-panel { flex: 1 1 auto; overflow-y: auto; padding: 16px; }
    .story-word-chip { cursor: pointer; }
    .story-word-chip:hover { border-color: var(--color-primary); }
    mark.story-hl { background-color: #ffe066; color: inherit; border-radius: 3px; padding: 0 2px; }
    .story-meta { font-size: 0.75em; color: var(--text-meta); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border-details); }
    /* The stat bar lives inside the scrolling tab panel, so it is pinned with
       position:sticky instead of scrolling away with the story text. Styled by
       ID on purpose: both the completed and the streaming modal paths overwrite
       className with 'story-list-meta', so a class rule would be dropped. */
    #storyModalMeta {
        position: sticky; top: 0; z-index: 2;
        background-color: var(--bg-card);
        /* Full-bleed past the tab panel's 16px padding so the bar spans edge to edge. */
        margin: -16px -16px 8px;
        padding: 8px 16px;
        border-bottom: 1px solid var(--border-details);
    }
    /* Stop-generating control: a pill like the other stats, but in danger red.
       Uses the filled square (fa-stop) rather than an X, which would be
       confused with the modal's own close button. */
    .story-stop {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 0.7em; white-space: nowrap; cursor: pointer;
        background: rgba(220, 38, 38, 0.1); color: #dc2626;
        padding: 2px 8px; border-radius: 999px; border: 1px solid rgba(220, 38, 38, 0.25);
        font-family: inherit;
    }
    .story-stop:hover { background: rgba(220, 38, 38, 0.2); color: #b91c1c; }
    /* Blinking caret at the tail of the text while it is still being written. */
    .stream-caret {
        display: inline-block; margin-left: 1px; color: var(--text-meta);
        animation: stream-caret-blink 1s steps(2, start) infinite;
    }
    @keyframes stream-caret-blink { to { visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) {
        .stream-caret { animation: none; }
    }
    .story-player { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border-details); flex-shrink: 0; }
    .story-seek { flex: 1; min-width: 80px; }
    .story-time { font-size: 0.8em; color: var(--text-meta); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .story-speed { font-size: 0.8em; color: var(--text-meta); display: flex; align-items: center; gap: 4px; }
    .story-speed select { padding: 4px 6px; border: 1px solid var(--border-input); border-radius: 4px; background-color: var(--bg-card); color: var(--text-primary); font: inherit; }
    .story-volume { display: flex; align-items: center; gap: 6px; font-size: 0.8em; color: var(--text-meta); }
    .story-volume input[type="range"] { width: 80px; accent-color: var(--color-success); cursor: pointer; }
    .story-volume span { min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }

    /* --- Stories Panel --- */
    #storiesPanel { display: none; }
    .panel-section {
        background-color: var(--bg-card);
        border: 1px solid var(--border-card);
        border-radius: 10px;
        box-shadow: 0 2px 5px var(--shadow-card);
        padding: 18px;
        margin-bottom: 20px;
    }
    .panel-section h3 { margin: 0 0 14px 0; color: var(--text-heading); font-size: 1.05em; }
    .gen-filter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .gen-filter select, .gen-filter input {
        padding: 7px 10px; border: 1px solid var(--border-input); border-radius: 4px;
        font-size: 0.8em; font-family: inherit; background-color: var(--bg-card); color: var(--text-primary);
        outline: none;
    }
    .gen-filter input { min-width: 90px; }
    .gen-filter select:focus, .gen-filter input:focus { border-color: var(--color-primary); }
    .filter-results {
        max-height: 220px; overflow-y: auto; border: 1px solid var(--border-card);
        border-radius: 6px; padding: 8px; background-color: var(--bg-editable); margin-bottom: 12px;
        display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 4px 12px;
    }
    .filter-item { display: flex; align-items: center; gap: 6px; font-size: 0.82em; cursor: pointer; padding: 2px 0; }
    .filter-item input { accent-color: var(--color-primary); }
    .filter-item .filter-meta { display: inline-flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
    .filter-item .filter-meta strong { color: var(--color-primary); min-width: 1.4em; }
    .filter-item .filter-sub { font-size: 0.82em; color: var(--text-meta); font-weight: 400; }
    .gen-selected { margin-bottom: 12px; font-size: 0.85em; }
    .gen-selected .sel-label { font-weight: 600; margin-right: 6px; color: var(--text-secondary); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chip {
        display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 14px;
        background: linear-gradient(#fff, #fff) padding-box, linear-gradient(135deg, #06b6d4, #a855f7) border-box;
        border: 2px solid transparent; color: #7c3aed; font-size: 0.78em; font-weight: 600;
    }
    [data-theme="dark"] .chip { background: linear-gradient(#1a0533, #1a0533) padding-box, linear-gradient(135deg, #06b6d4, #a855f7) border-box; color: #c084fc; }
    .chip.word-chip { cursor: pointer; }
    .chip.word-chip:hover { opacity: 0.8; }
    .gen-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .gen-actions input, .gen-actions select {
        box-sizing: border-box; padding: 7px 10px; border: 1px solid var(--border-input); border-radius: 4px;
        font-size: 0.8em; font-family: inherit; background-color: var(--bg-card); color: var(--text-primary); outline: none;
    }
    .gen-actions select:focus, .gen-actions input:focus { border-color: var(--color-primary); }
    #storyTitle { min-width: 160px; }
    #generateStoryBtn { flex-shrink: 0; }
    .model-ac { position: relative; flex: 0 1 340px; min-width: 200px; max-width: 360px; }
    .model-ac-input {
        box-sizing: border-box; width: 100%; padding: 7px 10px; border: 1px solid var(--border-input); border-radius: 4px;
        font-size: 0.8em; font-family: inherit; background-color: var(--bg-card); color: var(--text-primary); outline: none;
    }
    .model-ac-input:focus { border-color: var(--color-primary); }
    .model-ac-list {
        position: absolute; z-index: 50; top: calc(100% + 4px); left: 0; right: auto;
        width: max-content; max-width: 90vw;
        max-height: 280px; overflow-y: auto; border: 1px solid var(--border-input); border-radius: 6px;
        background-color: var(--bg-card); box-shadow: 0 8px 24px rgba(0,0,0,0.18); padding: 4px;
    }
    .model-ac-item {
        padding: 7px 9px; border-radius: 4px; font-size: 0.8em; cursor: pointer; color: var(--text-primary);
        white-space: nowrap;
        display: flex; align-items: center; gap: 8px;
    }
    .model-ac-item.kb-active, .model-ac-item:hover { background-color: var(--bg-editable); }

<script>
let currentlyEditing = null;
let toastTimer = null;
function showToast(msg) {
    const toast = document.getElementById('addWordToast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 5000);
}
const turndownService = new TurndownService();
let socket = null;
let currentSort = localStorage.getItem('wordSortBy') || 'updatedAt';
let currentOrder = localStorage.getItem('wordSortOrder') || 'desc';
let allWords = [];
let pendingAutoPlay = null;

async function addWord() {
  const input = document.getElementById('newWordInput');
  const btn = document.getElementById('addWordBtn');
  const word = input.value.trim();
  if (!word) return;

  btn.disabled = true;
  btn.textContent = '...';

  try {
    pendingAutoPlay = word;
    const body = { word };
    if (typeof window.isOpenRouter !== 'undefined' ? window.isOpenRouter : true) {
      const m = resolveModelFor(meaningsCtx) || null;
      if (m) body.meanings_model = m;
    }
    const res = await fetch('/api/word', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (res.ok) {
      const data = await res.json();
      input.value = '';
      showToast(data.message);
      await fetchData(currentSort, currentOrder);
      autoPlayMeaning(word);
      pendingAutoPlay = null;
    } else {
      alert('Failed to add word');
    }
  } catch (e) {
    alert('Error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Add';
  }
}

function connectWebSocket() {
    const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    const wsUrl = `${wsProtocol}//${window.location.host}/ws`;
    socket = new WebSocket(wsUrl);
    socket.onmessage = async (event) => {
        if (event.data.startsWith("update_words")) {
            let wordToPlay = null;
            const colonIndex = event.data.indexOf(':');
            if (colonIndex !== -1) {
                const message = event.data.substring(colonIndex + 1);
                showToast(message);
                const match = message.match(/'([^']+)'/);
                if (match) wordToPlay = match[1];
            }
            await fetchData(currentSort, currentOrder);
            // Skip if this is the local tab's own word (already handled by addWord)
            if (wordToPlay && wordToPlay !== pendingAutoPlay) {
                autoPlayMeaning(wordToPlay);
            }
        } else if (event.data.startsWith("update_stories")) {
            const panel = document.getElementById('storiesPanel');
            if (panel.style.display !== 'none') {
                loadStories();
            }
            // Refresh word badges too (story links may have changed).
            fetch('/api/story_counts').then(r => r.json()).then(c => { wordStoryCounts = c; applySearch(); }).catch(() => {});
        } else if (event.data.startsWith("story_audio_progress")) {
            const body = event.data.slice("story_audio_progress:".length);
            const [sid, pct] = body.split(':');
            if (pendingStoryAudio && String(pendingStoryAudio.id) === sid && pendingStoryAudio.btn) {
                pendingStoryAudio.btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Generating ${pct}%`;
            }
        } else if (event.data.startsWith("story_audio_ready")) {
            const sid = event.data.slice("story_audio_ready:".length);
            if (pendingStoryAudio && String(pendingStoryAudio.id) === sid) {
                const btn = pendingStoryAudio.btn;
                pendingStoryAudio = null;
                readStoryById(parseInt(sid, 10), btn);
            }
        } else if (event.data.startsWith("story_audio_error")) {
            const sid = event.data.slice("story_audio_error:".length);
            if (pendingStoryAudio && String(pendingStoryAudio.id) === sid) {
                const btn = pendingStoryAudio.btn;
                pendingStoryAudio = null;
                btn.disabled = false;
                if (btn.dataset.icon) btn.innerHTML = btn.dataset.icon;
                else btn.innerHTML = '<i class="fa-solid fa-volume-up"></i>';
                alert('Audio generation failed. Check the server logs.');
            }
        } else if (event.data.startsWith("story_delta")) {
            // Live story text: "story_delta:<id>:<json string>".
            const rest = event.data.slice("story_delta:".length);
            const sep = rest.indexOf(':');
            if (sep !== -1) {
                let text = '';
                try { text = JSON.parse(rest.slice(sep + 1)); } catch (e) { text = rest.slice(sep + 1); }
                onStoryDelta(parseInt(rest.slice(0, sep), 10), text);
            }
        } else if (event.data.startsWith("story_title")) {
            const rest = event.data.slice("story_title:".length);
            const sep = rest.indexOf(':');
            if (sep !== -1) {
                let title = '';
                try { title = JSON.parse(rest.slice(sep + 1)); } catch (e) { title = rest.slice(sep + 1); }
                onStoryTitle(parseInt(rest.slice(0, sep), 10), title);
            }
        } else if (event.data.startsWith("story_ready") || event.data.startsWith("story_error")) {
            // Background story generation finished (or failed). Drop the live
            // buffer and refresh the list so the placeholder swaps for the real
            // story. This also covers clients that reconnected mid-generation.
            const sid = parseInt(event.data.slice(event.data.indexOf(':') + 1), 10);
            const wasStreaming = storyStreams.has(sid);
            dropStoryStream(sid);
            unsubscribeStoryStream(sid);
            const panel = document.getElementById('storiesPanel');
            if (panel.style.display !== 'none') {
                loadStories();
            }
            if (event.data.startsWith("story_error")) {
                showToast(wasStreaming ? 'Story generation stopped.' : 'A story failed to generate.');
                if (currentModalStoryId === sid) closeStoryModal();
            } else if (currentModalStoryId === sid) {
                // Re-open from the DB so the modal shows the authoritative text.
                openStoryModal(sid);
            }
        }
    };
    socket.onopen = () => {
        console.log("WebSocket connection established.");
        // A fresh socket has no subscriptions; re-follow whatever is still open.
        const overlay = document.getElementById('storyModalOverlay');
        if (currentModalStoryId != null && overlay.classList.contains('open')) {
            subscribeStoryStream(currentModalStoryId);
        }
    };
    socket.onclose = () => setTimeout(connectWebSocket, 5000);
    socket.onerror = (error) => console.error("WebSocket error:", error);
}

async function saveCellChanges(cell) {
  if (!cell.hasAttribute('contenteditable') || currentlyEditing !== cell) {
    if (currentlyEditing === cell) currentlyEditing = null; return;
  }
  cell.removeAttribute('contenteditable');
  const originalCurrentlyEditing = currentlyEditing;
  currentlyEditing = null;
  const wordItem = cell.closest('.word-item');
  const id = parseInt(wordItem.dataset.id);
  const word = wordItem.dataset.word;
  const encounters = parseInt(wordItem.dataset.encounters);
  const meaningDiv = wordItem.querySelector('.meaning-content');
  const examplesDiv = wordItem.querySelector('.examples-content');
  const synonymsDiv = wordItem.querySelector('.synonyms-content');
  const editedMarkdownValue = cell.innerText.trim();
  let meaningMarkdown = (cell === meaningDiv) ? editedMarkdownValue : (meaningDiv.dataset.raw || '');
  let examplesMarkdown = (cell === examplesDiv) ? editedMarkdownValue : (examplesDiv.dataset.raw || '');
  let synonymsMarkdown = (cell === synonymsDiv) ? editedMarkdownValue : (synonymsDiv.dataset.raw || '');
  try {
    const response = await fetch('/api/words', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, word, meaning: meaningMarkdown, sentences: examplesMarkdown, synonyms: synonymsMarkdown, encounters })
    });
    if (!response.ok) throw new Error(`Update failed: ${response.status} ${await response.text()}`);
    cell.dataset.raw = editedMarkdownValue;
    cell.innerHTML = `<div class="rendered">${marked.parse(editedMarkdownValue || "")}</div>`;
  } catch (err) {
    console.error('Update failed on client:', err);
    alert(`Failed to save changes: ${err.message}`);
    const originalRaw = originalCurrentlyEditing.dataset.raw || '';
    originalCurrentlyEditing.innerHTML = `<div class="rendered">${marked.parse(originalRaw)}</div>`;
    originalCurrentlyEditing.removeAttribute('contenteditable');
  }
}

function makeEditable(cell) {
  if (currentlyEditing) { alert("Another cell is already being edited."); return; }
  currentlyEditing = cell;
  const rawMarkdown = cell.dataset.raw || "";
  cell.innerText = rawMarkdown;
  cell.setAttribute('contenteditable', 'true');
  cell.focus();
  const range = document.createRange();
  range.selectNodeContents(cell);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  cell.onpaste = (e) => {
    e.preventDefault();
    const html = e.clipboardData.getData('text/html');
    const plain = e.clipboardData.getData('text/plain');
    let markdownToInsert = plain;
    if (html) { try { markdownToInsert = turndownService.turndown(html); } catch (tdError) { console.error("Turndown error:", tdError); } }
    document.execCommand('insertText', false, markdownToInsert);
  };
  cell.onkeydown = async (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); await saveCellChanges(cell); }
    else if (e.key === 'Escape') {
      e.preventDefault();
      cell.removeAttribute('contenteditable');
      const originalRaw = cell.dataset.raw || '';
      cell.innerHTML = `<div class="rendered">${marked.parse(originalRaw)}</div>`;
      currentlyEditing = null;
    }
  };
  cell.onblur = () => { setTimeout(async () => { if (cell.hasAttribute('contenteditable') && currentlyEditing === cell) { await saveCellChanges(cell); } else if (currentlyEditing === cell) { currentlyEditing = null; } }, 100); };
}

function stripMarkdown(md) {
    return md
        .replace(/#{1,6}\s+/g, '')
        .replace(/\*\*_(.+?)_\*\*/g, '$1')
        .replace(/___(.+?)___/g, '$1')
        .replace(/\*\*\*(.+?)\*\*\*/g, '$1')
        .replace(/\*\*(.+?)\*\*/g, '$1')
        .replace(/__(.+?)__/g, '$1')
        .replace(/\*(.+?)\*/g, '$1')
        .replace(/_(.+?)_/g, '$1')
        .replace(/`(.+?)`/g, '$1')
        .replace(/\[(.+?)\]\(.+?\)/g, '$1')
        .replace(/^[-*+]\s+/gm, '')
        .replace(/^\d+\.\s+/gm, '')
        .trim();
}

let currentAudio = null;
let currentBtn = null;
let pendingStoryAudio = null;    // { id, btn } while background TTS is generating
const ttsCache = new Map();      // text -> object URL (in-memory audio cache)
const TTS_CACHE_MAX = 100;

function stopAudio() {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    if (currentBtn) { currentBtn.innerHTML = currentBtn.dataset.icon; currentBtn = null; }
}

async function playTTS(text, btn) {
    if (btn && currentBtn === btn) { stopAudio(); return; }
    stopAudio();
    if (btn) { btn.innerHTML = '<i class="fa-solid fa-circle-stop"></i>'; currentBtn = btn; }
    const volume = parseFloat(document.getElementById('volumeSlider').value);
    try {
        let url;
        if (ttsCache.has(text)) {
            url = ttsCache.get(text);
        } else {
            const res = await fetch('/api/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            if (!res.ok) throw new Error('TTS failed');
            const blob = await res.blob();
            url = URL.createObjectURL(blob);
            ttsCache.set(text, url);
            if (ttsCache.size > TTS_CACHE_MAX) {
                const oldest = ttsCache.keys().next().value;
                URL.revokeObjectURL(ttsCache.get(oldest));
                ttsCache.delete(oldest);
            }
        }
        const audio = new Audio(url);
        audio.volume = volume;
        currentAudio = audio;
        audio.play();
        audio.onended = () => { if (btn && currentBtn === btn) stopAudio(); };
    } catch (e) {
        console.error('TTS error:', e);
        if (btn && currentBtn === btn) stopAudio();
    }
}

function autoPlayMeaning(wordName) {
    if (!wordName) return;
    const item = allWords.find(w => w.word === wordName);
    if (!item || !item.meaning) return;
    const text = stripMarkdown(item.meaning);
    if (!text) return;
    stopAudio();
    playTTS(text, null);
}

function pronounceWord(btn, event) {
    event.stopPropagation();
    const word = btn.closest('.word-item').dataset.word;
    playTTS(word, btn);
}

function speakSection(btn, event) {
    event.stopPropagation();
    const content = btn.closest('.detail-section').querySelector('.editable-content');
    const text = stripMarkdown(content.dataset.raw || '');
    if (!text) return;
    playTTS(text, btn);
}

function deleteItem(button) {

  const id = wordItem.dataset.id;
  const word = wordItem.dataset.word;
  if (confirm(`Are you sure you want to delete "${word}" (ID ${id})?`)) {
    fetch(`/api/words/${id}`, { method: 'DELETE' })
    .then(response => { if (!response.ok) response.text().then(text => alert(`Failed to delete word: ${text}`)); })
    .catch(err => alert(`Error while deleting word: ${err.message}`));
  }
}

// --- Story modal ---
let currentModalStoryId = null;

// Live text of in-flight stories: id -> {text, title, renderTimer, listTimer,
// tickTimer, startedAt}.
const storyStreams = new Map();

// Re-rendering Markdown for every token is far too expensive, so the modal is
// refreshed on this interval instead.
const STREAM_RENDER_MS = 150;

// Rough token estimate from character count (~4 chars/token). OpenRouter only
// sends `usage` in the final SSE chunk, so a real count is impossible while the
// story is streaming — this is shown with a "≈" to make that clear.
function estimateTokens(text) {
    return Math.round(countStoryChars(text || '') / 4);
}

function storyStreamState(id) {
  let st = storyStreams.get(id);
  if (!st) {
    st = { text: '', title: null, renderTimer: null, listTimer: null, tickTimer: null, startedAt: null };
    storyStreams.set(id, st);
  }
  return st;
}

function subscribeStoryStream(id) {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: 'subscribe_story', id }));
  }
}

function unsubscribeStoryStream(id) {
  if (socket && socket.readyState === WebSocket.OPEN) {
    socket.send(JSON.stringify({ type: 'unsubscribe_story', id }));
  }
}

function dropStoryStream(id) {
  const st = storyStreams.get(id);
  if (st) {
    if (st.renderTimer) clearTimeout(st.renderTimer);
    if (st.listTimer) clearTimeout(st.listTimer);
    if (st.tickTimer) clearInterval(st.tickTimer);
  }
  storyStreams.delete(id);
}

// Elapsed comes from the story's createdAt (set when the row was inserted, i.e.
// when generation started) rather than from the first delta, so a tab that
// opens the story mid-generation still shows the true elapsed time.
function streamStartedAt(id, story) {
  const st = storyStreamState(id);
  if (st.startedAt == null) {
    const created = story && story.createdAt ? Date.parse(String(story.createdAt).replace(' ', 'T') + 'Z') : NaN;
    st.startedAt = isNaN(created) ? Date.now() : created;
  }
  return st.startedAt;
}

function streamElapsedSec(id) {
  const st = storyStreams.get(id);
  if (!st || st.startedAt == null) return 0;
  return Math.max(0, (Date.now() - st.startedAt) / 1000);
}

function formatElapsed(sec) {
  if (sec < 60) return `${sec.toFixed(1)}s`;
  const m = Math.floor(sec / 60);
  return `${m}:${Math.floor(sec % 60).toString().padStart(2, '0')}`;
}

function streamRate(id) {
  const st = storyStreams.get(id);
  if (!st) return 0;
  const secs = streamElapsedSec(id);
  return secs > 0.4 ? Math.round(estimateTokens(st.text) / secs) : 0;
}

// Build one stat pill, matching the .story-list-meta-line look.
function statPill(html) {
  const span = document.createElement('span');
  span.className = 'story-list-meta-line';
  span.innerHTML = html;
  return span;
}

function renderStreamedStory(id) {
  const st = storyStreams.get(id);
  if (!st) return;
  if (currentModalStoryId !== id) return;
  const overlay = document.getElementById('storyModalOverlay');
  const body = document.getElementById('storyModalBody');
  if (!overlay.classList.contains('open')) return;
  // Follow the tail only when the reader is already at the bottom, so scrolling
  // back to re-read a sentence is not fought by the stream. The tolerance
  // accounts for the sticky stat bar sitting above the text.
  const scroller = body.parentElement;
  const atBottom = scroller
    ? scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 90
    : true;
  // The caret marks the text as still being written. This function only runs
  // while a stream is live (dropStoryStream removes the entry on story_ready /
  // story_error, and the modal is re-rendered from the DB at that point).
  const caret = '<span class="stream-caret">&#9613;</span>';
  body.innerHTML = `<div class="rendered">${marked.parse(stripStoryLabels(st.text))}${caret}</div>`;
  if (atBottom && scroller) scroller.scrollTop = scroller.scrollHeight;
  updateStreamStats(id);
}

function scheduleStreamRender(id) {
  const st = storyStreamState(id);
  if (st.renderTimer) return;
  st.renderTimer = setTimeout(() => {
    st.renderTimer = null;
    renderStreamedStory(id);
  }, STREAM_RENDER_MS);
}

// Refresh the elapsed / token / rate pills while a story streams. The token
// figure is an estimate until the real usage arrives with story_ready.
function updateStreamStats(id) {
  const st = storyStreams.get(id);
  if (!st) return;
  const secs = streamElapsedSec(id);
  const est = estimateTokens(st.text);
  const rate = streamRate(id);
  if (currentModalStoryId === id) {
    const el = document.getElementById('storyModalMeta');
    if (el) {
      const t = el.querySelector('[data-stat="elapsed"]');
      if (t) t.textContent = formatElapsed(secs);
      const k = el.querySelector('[data-stat="tokens"]');
      if (k) k.textContent = `\u2248${est.toLocaleString()} tokens`;
      const r = el.querySelector('[data-stat="rate"]');
      if (r) r.textContent = rate > 0 ? `\u2248${rate.toLocaleString()} tok/s` : 'measuring\u2026';
    }
  }
  updateStreamListItem(id, est);
}

function updateStreamListItem(id, est) {
  const item = document.querySelector(`.story-list-item[data-id="${id}"]`);
  if (!item) return;
  const statusLine = item.querySelector('.story-list-status-line');
  if (!statusLine) return;
  const st = storyStreams.get(id);
  const tokens = est != null ? est : (st ? estimateTokens(st.text) : 0);
  statusLine.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Generating\u2026 \u2248${tokens.toLocaleString()} tokens`;
}

function scheduleStreamListUpdate(id) {
  const st = storyStreamState(id);
  if (st.listTimer) return;
  st.listTimer = setTimeout(() => {
    st.listTimer = null;
    updateStreamListItem(id);
  }, 250);
}

// Elapsed and rate change even when no new token arrives, so they need their
// own 1s ticker rather than riding on the delta cadence.
function startStreamTicker(id) {
  const st = storyStreamState(id);
  if (st.tickTimer) return;
  st.tickTimer = setInterval(() => updateStreamStats(id), 1000);
}

function onStoryDelta(id, chunk) {
  const st = storyStreamState(id);
  st.text += chunk;
  startStreamTicker(id);
  scheduleStreamRender(id);
  scheduleStreamListUpdate(id);
}

function onStoryTitle(id, title) {
  const st = storyStreamState(id);
  st.title = title;
  if (currentModalStoryId === id) {
    const el = document.getElementById('storyModalTitle');
    if (el && el.textContent !== title) el.textContent = title;
  }
  const item = document.querySelector(`.story-list-item[data-id="${id}"] .story-list-title`);
  if (item) item.textContent = title;
}

function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(String(ts).replace(' ', 'T') + 'Z');
  if (isNaN(d.getTime())) return ts;
  const day = String(d.getDate()).padStart(2, '0');
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const year = d.getFullYear();
  const hours = String(d.getHours()).padStart(2, '0');
  const minutes = String(d.getMinutes()).padStart(2, '0');
  return `${day}/${month}/${year} ${hours}:${minutes}`;
}

function formatDateTime(ts) {
  if (!ts) return '';
  const d = new Date(String(ts).replace(' ', 'T') + 'Z');
  if (isNaN(d.getTime())) return ts;
  const day = String(d.getDate()).padStart(2, '0');
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const year = d.getFullYear();
  const hours = String(d.getHours()).padStart(2, '0');
  const minutes = String(d.getMinutes()).padStart(2, '0');
  const seconds = String(d.getSeconds()).padStart(2, '0');
  return `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;
}

function formatDuration(ms) {
  if (ms == null || isNaN(ms)) return '';
  const totalSec = Math.round(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function stripStoryLabels(text) {
  if (!text) return '';
  let t = text.replace(/^\s*Title:\s*[^\n]*/i, '');
  t = t.replace(/^\s*Story:\s*/i, '');
  return t.trim();
}

function countStoryChars(content) {
  // Count the actual story prose (excluding the "Title:"/"Story:" labels),
  // including spaces — a standard character count.
  return stripStoryLabels(content || '').length;
}

// Open a story that is still generating: show a live preview fed by the
// WebSocket deltas. The server replays everything generated so far on
// subscribe, so joining mid-stream is seamless.
function openGeneratingStoryModal(id, s) {
  const st = storyStreamState(id);
  streamStartedAt(id, s);
  const overlay = document.getElementById('storyModalOverlay');
  switchStoryTab();
  document.getElementById('storyModalTitle').textContent = st.title || s.title || 'Generating…';
  const body = document.getElementById('storyModalBody');
  body.innerHTML = st.text
    ? `<div class="rendered">${marked.parse(stripStoryLabels(st.text))}<span class="stream-caret">&#9613;</span></div>`
    : '<p style="color:var(--text-meta)"><i class="fa-solid fa-spinner fa-spin"></i> Waiting for the first words…</p>';

  // Stat bar: live elapsed, estimated tokens, rate, and the square Stop button.
  // The className is 'story-list-meta' so it keeps the existing row-of-pills
  // look; the sticky positioning comes from the #storyModalMeta CSS rule.
  const metaEl = document.getElementById('storyModalMeta');
  metaEl.className = 'story-list-meta';
  metaEl.style.display = '';
  metaEl.innerHTML = '';
  const elapsed = statPill(`<i class="fa-solid fa-spinner fa-spin"></i> <span data-stat="elapsed">${formatElapsed(streamElapsedSec(id))}</span>`);
  metaEl.appendChild(elapsed);
  metaEl.appendChild(statPill(`<i class="fa-solid fa-font"></i> <span data-stat="tokens">\u2248${estimateTokens(st.text).toLocaleString()} tokens</span>`));
  metaEl.appendChild(statPill(`<i class="fa-solid fa-gauge-high"></i> <span data-stat="rate">measuring\u2026</span>`));
  const stopBtn = document.createElement('button');
  stopBtn.className = 'story-stop';
  stopBtn.title = 'Stop generating this story';
  stopBtn.innerHTML = '<i class="fa-solid fa-stop"></i> Stop';
  stopBtn.onclick = () => cancelStory(id);
  metaEl.appendChild(stopBtn);

  // The word chips aren't known until the story is saved; hide the old ones.
  document.getElementById('storyModalWordsChips').innerHTML = '';

  // Nothing to read aloud yet: the content is still NULL, and generating audio
  // from an empty string would burn minutes of CPU and leave a 0-length
  // audio_path on the story.
  setReadAloudEnabled(false);

  overlay.classList.add('open');
  subscribeStoryStream(id);
  startStreamTicker(id);
  renderStreamedStory(id);
}

// Read Aloud is meaningless (and harmful) while the text is still streaming.
function setReadAloudEnabled(enabled) {
  const rb = document.getElementById('storyModalReadBtn');
  if (!rb) return;
  rb.style.display = enabled ? '' : 'none';
  rb.disabled = !enabled;
}

async function openStoryModal(id) {
  // Leaving a previous story: stop following its live text.
  if (currentModalStoryId != null && currentModalStoryId !== id) {
    unsubscribeStoryStream(currentModalStoryId);
  }
  currentModalStoryId = id;
  stopAudio();
  hideStoryPlayer();
  try {
    const res = await fetch(`/api/stories/${id}`);
    if (!res.ok) return;
    const s = await res.json();

    if (s.status === 'generating') {
      // Follow the live stream instead of showing an empty body.
      openGeneratingStoryModal(id, s);
      return;
    }

    dropStoryStream(id);
    document.getElementById('storyModalTitle').textContent = s.title || 'Untitled';
    document.getElementById('storyModalBody').innerHTML = `<div class="rendered">${marked.parse(stripStoryLabels(s.content || ''))}</div>`;
    const metaEl = document.getElementById('storyModalMeta');
    metaEl.className = 'story-list-meta';
    metaEl.innerHTML = '';
    const addMeta = (icon, text) => {
      const span = document.createElement('span');
      span.className = 'story-list-meta-line';
      if (icon) {
        const i = document.createElement('i');
        i.className = icon;
        span.appendChild(i);
      }
      span.appendChild(document.createTextNode(' ' + text));
      metaEl.appendChild(span);
    };
    const chars = countStoryChars(s.content);
    if (chars > 0) addMeta('fa-solid fa-font', `${chars.toLocaleString()} chars`);
    // Real token counts, persisted with the story at generation time. Older
    // stories predate the columns and simply have nothing to show here.
    const outTok = s.completion_tokens || 0;
    const inTok = s.prompt_tokens || 0;
    if (outTok || inTok) {
      const reasoning = s.reasoning_tokens || 0;
      const label = `${inTok.toLocaleString()} in \u2022 ${outTok.toLocaleString()} out`
        + (reasoning > 0 ? ` (${reasoning.toLocaleString()} reasoning)` : '');
      addMeta('fa-solid fa-arrow-down-up', label);
    }
    if (s.model) addMeta('fa-solid fa-robot', s.model.replace(/^.*\//, ''));
    if (s.cost != null) addMeta('fa-solid fa-coins', s.cost > 0 ? `$${s.cost.toFixed(5)}` : 'free');
    const dur = formatDuration(s.duration_ms);
    if (dur) addMeta('fa-solid fa-stopwatch', dur);
    const dateStr = formatDate(s.createdAt);
    if (dateStr) addMeta('fa-solid fa-calendar', dateStr);
    if (metaEl.childElementCount) {
      metaEl.style.display = '';
    } else {
      metaEl.style.display = 'none';
    }
    setReadAloudEnabled(true);
    const chipsBox = document.getElementById('storyModalWordsChips');
    chipsBox.innerHTML = '';
    (s.words || []).forEach(w => {
      const span = document.createElement('span');
      span.className = 'chip story-word-chip';
      span.textContent = w.word;
      span.title = 'Find "' + w.word + '" in the story';
      span.onclick = () => { switchStoryTab(); highlightWordInStory(w.word); };
      chipsBox.appendChild(span);
    });
    switchStoryTab();
    document.getElementById('storyModalOverlay').classList.add('open');
  } catch (e) { /* ignore */ }
}

function closeStoryModal() {
  document.getElementById('storyModalOverlay').classList.remove('open');
  if (currentModalStoryId != null) unsubscribeStoryStream(currentModalStoryId);
  stopAudio();
  hideStoryPlayer();
}

function clearStoryHighlights() {
  document.querySelectorAll('#storyModalBody mark.story-hl').forEach(m => {
    const parent = m.parentNode;
    if (!parent) return;
    parent.replaceChild(document.createTextNode(m.textContent), m);
    parent.normalize();
  });
}

function highlightWordInStory(word) {
  clearStoryHighlights();
  const body = document.getElementById('storyModalBody');
  if (!body || !word) return;
  const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('\\b(' + escaped + ')\\b', 'gi');
  const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) nodes.push(n);
  let firstMark = null;
  nodes.forEach(node => {
    const text = node.nodeValue;
    re.lastIndex = 0;
    let m, last = 0, matched = false;
    const frag = document.createDocumentFragment();
    while ((m = re.exec(text)) !== null) {
      matched = true;
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const mark = document.createElement('mark');
      mark.className = 'story-hl';
      mark.textContent = m[0];
      frag.appendChild(mark);
      if (!firstMark) firstMark = mark;
      last = m.index + m[0].length;
    }
    if (matched) {
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    }
  });
  if (firstMark) firstMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// --- Stories feature ---
let selectedWords = new Set();
let currentStoryId = null;
let wordStoryCounts = {};

async function applyFilter() {
  const field = document.getElementById('filterField').value;
  const direction = document.getElementById('filterDirection').value;
  const min = document.getElementById('filterMin').value.trim();
  const max = document.getElementById('filterMax').value.trim();
  const qs = new URLSearchParams({ field, direction });
  if (min) qs.set('min', min);
  if (max) qs.set('max', max);
  const res = await fetch(`/api/words/filter?${qs}`);
  const data = await res.json();
  renderFilterResults(data);
}

function renderFilterResults(data) {
  const box = document.getElementById('filterResults');
  box.innerHTML = '';
  if (!data.length) {
    box.innerHTML = '<span style="font-size:0.8em;color:var(--text-meta);">No words match this filter.</span>';
    return;
  }
  // Absolute position is tied to the from/to config (1-based).
  const minRaw = document.getElementById('filterMin').value.trim();
  const start = minRaw ? Math.max(1, parseInt(minRaw, 10) || 1) : 1;
  data.forEach((w, idx) => {
    const pos = start + idx;
    const label = document.createElement('label');
    label.className = 'filter-item';
    label.dataset.word = w.word;
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = selectedWords.has(w.word);
    cb.addEventListener('change', () => {
      if (cb.checked) selectedWords.add(w.word); else selectedWords.delete(w.word);
      renderChips();
      updateSelectToggleUI();
    });
    const meta = document.createElement('span');
    meta.className = 'filter-meta';
    const updated = (w.updatedAt || w.createdAt || '').split(' ')[0];
    meta.innerHTML = `<strong>${pos}.</strong> ${w.word} <span class="filter-sub">enc: ${w.encounters} · ${updated}</span>`;
    label.appendChild(cb);
    label.appendChild(meta);
    box.appendChild(label);
  });
  updateSelectToggleUI();
}

function renderChips() {
  // Just update the count; deselect by unchecking items in filter results.
  document.getElementById('selCount').textContent =
    selectedWords.size ? `Selected: ${selectedWords.size}` : '';
}

// --- OpenRouter model picker (full live catalogue via backend proxy). Last choice persisted in localStorage. ---
let ALL_MODELS = [];
let modelsLoading = false;
let modelsError = null;

let storyModelSelection = "";  // committed id: "" = Default, "__custom__", or a model id
let _serverConfig = {};  // from GET /api/config — DB-backed model selections

async function populateModelSelect() {
  if (modelsLoading) return;
  modelsLoading = true;
  modelsError = null;
  refreshModelACIfOpen();
  try {
    const res = await fetch('/api/openrouter/models');
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      throw new Error(e.detail || `HTTP ${res.status}`);
    }
    const data = await res.json();
    const list = (data.models || []).map(m => makeModel(
      m.id,
      m.name || m.id,
      ((m.pricing && m.pricing.prompt) || 0) * 1e6,
      ((m.pricing && m.pricing.completion) || 0) * 1e6
    ));
    // Cheapest first (free = 0).
    list.sort((a, b) => a.price - b.price);
    ALL_MODELS = list;
  } catch (e) {
    modelsError = e.message || 'Failed to load models';
  } finally {
    modelsLoading = false;
    restoreStoryModel();
    refreshModelACIfOpen();
    // Also restore the new meanings picker (defined below) once the
    // catalogue is ready. Done after restoreStoryModel to keep the
    // existing call order intact.
    if (typeof restoreModelFor === 'function') {
      for (const ctx of (typeof modelPickers !== 'undefined' ? modelPickers : [])) {
        restoreModelFor(ctx);
        _refreshACIfOpen(ctx);
      }
    }
    // Now that ALL_MODELS is populated, refresh the Default model row so
    // the human name + free/paid tag appear.
    if (typeof _fillDefaultModelInfo === 'function') {
      _fillDefaultModelInfo();
      if (typeof updateMeaningsDefaultRow === 'function') updateMeaningsDefaultRow();
      if (typeof updateMeaningsCurrentBar === 'function') updateMeaningsCurrentBar();
    }
  }
}

function retryLoadModels() { populateModelSelect(); }

// Re-render the dropdown if it is currently visible.
function refreshModelACIfOpen() {
  const list = document.getElementById('storyModelList');
  if (list && list.style.display !== 'none') {
    renderModelAC(document.getElementById('storyModelInput').value);
  }
}

// Display label for a dropdown row when navigating with the keyboard.
// Uses the human-readable name (or the first child textContent) and falls back
// to the raw textContent for single-line rows.
function _rowLabel(row) {
  if (!row) return '';
  const nameEl = row.querySelector('.model-ac-name');
  if (nameEl) return nameEl.textContent;
  return row.textContent;
}

// Normalize a model entry into { id, label, price } with a human-readable price tag.
function makeModel(id, name, pIn, pOut, rec) {
  const free = pIn <= 0 && pOut <= 0;
  const tags = [];
  if (free) tags.push('free'); else tags.push('paid');
  if (rec) tags.push('recommended');
  let label = name;
  if (tags.length) label += ` (${tags.join(', ')})`;
  if (!free) label += ` · $${pIn.toFixed(3)}/$${pOut.toFixed(3)} per 1M`;
  return { id, label, price: pIn + pOut, pIn, pOut };
}

// Render the autocomplete dropdown filtered by query.
function renderModelAC(query) {
  const list = document.getElementById('storyModelList');
  const q = (query || '').trim().toLowerCase();
  let statusItems = [];
  if (modelsLoading) {
    statusItems = [{ id: '__loading__', label: 'Loading models…', pseudo: true }];
  } else if (modelsError && !ALL_MODELS.length) {
    statusItems = [{ id: '__retry__', label: '\u26a0 Failed to load models \u2014 click to retry', pseudo: true }];
  }
  const matches = ALL_MODELS.filter(m =>
    !q || m.label.toLowerCase().includes(q) || m.id.toLowerCase().includes(q)
  ).slice(0, 60);
  const items = [{ id: '', label: 'Default model' }, ...statusItems, ...matches, { id: '__custom__', label: 'Custom…' }];
  list.innerHTML = '';
  items.forEach(it => {
    const div = document.createElement('div');
    div.className = 'model-ac-item' + (it.pseudo ? ' model-ac-pseudo' : '') + (it.id === storyModelSelection ? ' selected' : '');
    div.dataset.id = it.id;
    if (it.id && it.id !== '__custom__' && it.id !== '__loading__' && it.id !== '__retry__') {
      const m = ALL_MODELS.find(x => x.id === it.id);
      if (m) {
        const name = document.createElement('span');
        name.className = 'model-ac-name';
        name.textContent = m.label.split(' (')[0];
        div.appendChild(name);
        const idEl = document.createElement('span');
        idEl.className = 'model-ac-id';
        idEl.textContent = m.id;
        div.appendChild(idEl);
        const tags = document.createElement('span');
        tags.className = 'model-ac-tags';
        const free = m.price <= 0;
        const t = document.createElement('span');
        t.className = 'model-ac-tag' + (free ? ' free' : '');
        t.textContent = free
          ? 'free'
          : `$${m.pIn.toFixed(3)} in / $${m.pOut.toFixed(3)} out per 1M`;
        tags.appendChild(t);
        if (it.id === storyModelSelection) {
          const ck = document.createElement('span');
          ck.className = 'model-ac-tag recommended';
          ck.textContent = '\u2713';
          ck.title = 'Currently selected';
          tags.appendChild(ck);
        }
        div.appendChild(tags);
      } else {
        div.textContent = it.label;
      }
    } else {
      div.textContent = it.label;
    }
    if (it.id === '__retry__') {
      div.addEventListener('mousedown', (e) => { e.preventDefault(); retryLoadModels(); });
    } else if (!it.pseudo) {
      div.addEventListener('mousedown', (e) => { e.preventDefault(); selectModelAC(it.id); });
    }
    div.addEventListener('mouseenter', () => {
      list.querySelectorAll('.model-ac-item').forEach(x => x.classList.remove('kb-active'));
      div.classList.add('kb-active');
    });
    list.appendChild(div);
  });
  list.style.display = items.length ? 'block' : 'none';
}

function selectModelAC(id) {
  if (id === '__loading__' || id === '__retry__') return;
  storyModelSelection = id;
  // Persist to DB (single source of truth for all clients / WebSocket sync).
  fetch('/api/config', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ story_model: id }) }).catch(() => {});
  const custom = document.getElementById('storyModelCustom');
  if (id === '__custom__') {
    custom.value = '';
    custom.style.display = '';
  } else {
    custom.style.display = 'none';
  }
  syncModelInputToSelection();
  document.getElementById('storyModelList').style.display = 'none';
}

function syncModelInputToSelection() {
  const input = document.getElementById('storyModelInput');
  const custom = document.getElementById('storyModelCustom');
  if (storyModelSelection === '__custom__') {
    input.value = 'Custom…';
    custom.style.display = '';
  } else if (storyModelSelection === '') {
    input.value = 'Default model';
    custom.style.display = 'none';
  } else {
    const m = ALL_MODELS.find(x => x.id === storyModelSelection);
    input.value = m ? m.label : storyModelSelection;
    custom.style.display = 'none';
  }
}

function resolveStoryModel() {
  if (storyModelSelection === '__custom__') {
    return document.getElementById('storyModelCustom').value.trim() || null;
  }
  return storyModelSelection || null;
}

function restoreStoryModel() {
  const saved = _serverConfig.story_model || null;
  if (saved) storyModelSelection = saved;
  if (storyModelSelection === '__custom__') {
    document.getElementById('storyModelCustom').value = _serverConfig.story_model_custom || '';
  }
  syncModelInputToSelection();
}

    idSpan.textContent = m.id;

      : `$${m.pIn.toFixed(3)} in / $${m.pOut.toFixed(3)} out per 1M`;

    if (m.id === storyModelSelection) {
      const ck = document.createElement('span');
      ck.className = 'model-ac-tag recommended';
      ck.textContent = '\u2713';

    div.addEventListener('mousedown', (e) => { e.preventDefault(); setupSelectModel(m.id); });

function setupSelectModel(id) {
  if (id === '__loading__' || id === '__retry__') return;
  storyModelSelection = id;
  storyProviderSelection = '';  // reset provider when model changes
  // Persist to DB
  fetch('/api/config', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ story_model: id, story_provider: '' }) }).catch(() => {});
  // Show provider step
  const m = ALL_MODELS.find(x => x.id === id);
  document.getElementById('setupModelNameDisplay').textContent = m ? (m.name || m.id) : id;
  showSetupProviderStep();
  // Fetch providers for this model
  fetchSetupProviders(id);
}

function setupBackToModels() {
