<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live Editable Word Grid</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root {
        --bg-page:        #f4f4f9;
        --bg-card:        #fff;
        --bg-hover:       #f9f9f9;
        --bg-meta:        #f7f7f7;
        --bg-editable:    #f9f9f9;
        --bg-editable-focus: #eef4ff;
        --bg-sort-btn:    #e0e0e0;
        --bg-word-count:  #e9ecef;

        --border-card:    #ddd;
        --border-input:   #ccc;
        --border-details: #eee;

        --text-primary:   #333;
        --text-secondary: #555;
        --text-meta:      #666;
        --text-heading:   #0056b3;

        --color-primary:  #007bff;
        --color-success:  #28a745;
        --color-success-hover: #218838;
        --color-success-disabled: #94d3a2;
        --color-danger:   #dc3545;

        --shadow-card:    rgba(0,0,0,0.07);
        --shadow-btn:     rgba(0,0,0,0.1);
        --shadow-search:  rgba(0,123,255,0.15);
        --shadow-add:     rgba(40,167,69,0.15);
    }

    [data-theme="dark"] {
        --bg-page:        #191D24; /* black0 */
        --bg-card:        #1E222A; /* black1 */
        --bg-hover:       #222630; /* black2 */
        --bg-meta:        #191D24; /* black0 */
        --bg-editable:    #222630; /* black2 */
        --bg-editable-focus: #242933; /* gray0 */
        --bg-sort-btn:    #2E3440; /* gray1 */
        --bg-word-count:  #2E3440; /* gray1 */

        --border-card:    #3B4252; /* gray2 */
        --border-input:   #434C5E; /* gray3 */
        --border-details: #2E3440; /* gray1 */

        --text-primary:   #D8DEE9; /* white1 */
        --text-secondary: #C0C8D8; /* white_alt */
        --text-meta:      #60728A; /* gray5 */
        --text-heading:   #81A1C1; /* blue1 */

        --shadow-card:    rgba(0,0,0,0.3);
        --shadow-btn:     rgba(0,0,0,0.3);
        --shadow-search:  rgba(129,161,193,0.2); /* blue1 */
        --shadow-add:     rgba(163,190,140,0.2); /* green */
    }

    body {
        font-family: 'Inter', sans-serif;
        margin: 0; /* Reset default browser margin */
        padding: 20px; /* Add padding for spacing from screen edges */
        background-color: var(--bg-page);
        color: var(--text-primary);
    }

    /* --- Controls at the top --- */
    .controls-container {
        margin-bottom: 20px; /* Space between controls and grid */
    }
    #sortControls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }
    .sort-btn {
        background: linear-gradient(#7c3aed, #7c3aed) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
        color: #fff;
    }
    .sort-btn.active {
        background: linear-gradient(#6d28d9, #6d28d9) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
        color: #fff;
        box-shadow: 0 2px 4px var(--shadow-btn);
    }
    [data-theme="dark"] .sort-btn {
        background: linear-gradient(#3b0764, #3b0764) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
    }
    [data-theme="dark"] .sort-btn.active {
        background: linear-gradient(#2e1065, #2e1065) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
    }
    #wordCount {
        display: inline-block;
        background-color: var(--bg-sort-btn);
        color: var(--text-primary);
        font-size: 0.8em;
        font-weight: 500;
        padding: 8px 12px;
        border-radius: 4px;
        align-self: center;
        white-space: nowrap;
        margin-left: auto;
    }
    #searchInput {
        padding: 7px 12px;
        border: 1px solid var(--border-input);
        border-radius: 4px;
        font-size: 0.8em;
        font-family: inherit;
        outline: none;
        min-width: 200px;
        transition: border-color 0.15s;
        background-color: var(--bg-card);
        color: var(--text-primary);
    }
    #searchInput:focus {
        border-color: var(--color-primary);
        box-shadow: 0 0 0 2px var(--shadow-search);
    }
    .add-word-group {
        display: flex;
        gap: 0;
    }
    .export-group {
        display: flex;
        gap: 0;
        align-items: center;
    }
    #csvLimitInput {
        padding: 7px 12px;
        border: 1px solid var(--border-input);
        border-radius: 4px 0 0 4px;
        border-right: none;
        font-size: 0.8em;
        font-family: inherit;
        outline: none;
        width: 64px;
        background-color: var(--bg-card);
        color: var(--text-primary);
    }
    #csvLimitInput:focus {
        border-color: var(--color-primary);
    }
    #copyCsvBtn {
        border-radius: 0 4px 4px 0;
        padding: 7px 12px;
        font-size: 0.8em;
        margin-left: 0;
    }
    #newWordInput {
        padding: 7px 12px;
        border: 1px solid var(--border-input);
        border-right: none;
        border-radius: 4px 0 0 4px;
        font-size: 0.8em;
        font-family: inherit;
        outline: none;
        min-width: 160px;
        transition: border-color 0.15s;
        background-color: var(--bg-card);
        color: var(--text-primary);
    }
    #newWordInput:focus {
        border-color: var(--color-success);
        box-shadow: 0 0 0 2px var(--shadow-add);
    }
    #addWordBtn {
        background: linear-gradient(#7c3aed, #7c3aed) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
        color: white;
        border-radius: 0 4px 4px 0;
        padding: 7px 14px;
        font-size: 0.8em;
    }
    #addWordBtn:hover:not(:disabled) {
        background: linear-gradient(#6d28d9, #6d28d9) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
    }
    #addWordBtn:disabled {
        background: linear-gradient(#a78bfa, #a78bfa) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
        cursor: not-allowed;
    }
    [data-theme="dark"] #addWordBtn {
        background: linear-gradient(#3b0764, #3b0764) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
    }
    [data-theme="dark"] #addWordBtn:hover:not(:disabled) {
        background: linear-gradient(#2e1065, #2e1065) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
    }
    [data-theme="dark"] #addWordBtn:disabled {
        background: linear-gradient(#4c1d95, #4c1d95) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
    }

    #addWordToast {
        position: fixed;
        top: 24px;
        right: 24px;
        left: auto;
        transform: translateX(20px);
        background-color: var(--bg-card);
        color: var(--text-primary);
        border: 2px solid var(--color-primary);
        border-radius: 8px;
        padding: 12px 20px;
        font-size: 0.9em;
        font-weight: 500;
        box-shadow: 0 6px 20px var(--shadow-card);
        opacity: 0;
        transition: opacity 0.3s, transform 0.3s;
        pointer-events: none;
        z-index: 1000;
        white-space: nowrap;
    }
    #addWordToast.show {
        opacity: 1;
        transform: translateX(0);
    }

    /* Grid Container and Columns - Now Full Width */
    #wordGridContainer {
        display: flex;
        gap: 15px;
        align-items: flex-start;
    }
    .grid-column {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    /* Word Item Styling (Card) */
    .word-item {
        background-color: var(--bg-card);
        border: 1px solid var(--border-card);
        border-radius: 8px;
        box-shadow: 0 2px 5px var(--shadow-card);
        overflow: hidden;
    }
    .word-header {
        padding: 15px;
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1em;
        font-weight: 600;
        user-select: none;
    }
    .word-header:hover { background-color: var(--bg-hover); }
    .word-header .word-title { flex-grow: 0; user-select: text; cursor: text; margin-right: 4px; padding-right: 4px; margin-left: 6px; }
    .word-header .indicator { font-size: 1.2em; line-height: 1; color: var(--color-primary); width: 1em; text-align: center; flex-shrink: 0; }
    .freq-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 22px;
        height: 22px;
        border-radius: 11px;
        background: linear-gradient(#fff, #fff) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
        border: 2px solid transparent;
        color: #7c3aed;
        font-size: 0.72em;
        font-weight: 700;
        padding: 0 5px;
        margin-right: 8px;
        margin-left: auto;
        flex-shrink: 0;
    }
    [data-theme="dark"] .freq-badge {
        background: linear-gradient(#1a0533, #1a0533) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
        color: #c084fc;
    }
    .word-details {
        display: none;
        padding: 0 15px 15px 15px;
        border-top: 1px solid var(--border-details);
    }
    .detail-section { margin-bottom: 12px; }
    .detail-section .metadata {
        font-size: 0.75em;
        color: var(--text-meta);
        padding: 8px;
        background: var(--bg-meta);
        border-radius: 4px;
    }

    /* Editable and Rendered Content */
    .editable-content {
        padding: 8px;
        border: 1px solid var(--border-input);
        border-radius: 4px;
        background-color: var(--bg-editable);
        color: var(--text-primary);
        min-height: 40px;
        font-size: 0.8em;
    }
    .editable-content[contenteditable] {
        outline: 2px solid var(--color-primary);
        background-color: var(--bg-editable-focus);
    }
    .rendered p, .rendered ul, .rendered ol { margin-top: 0; margin-bottom: 0.5em; }
    .rendered ul, .rendered ol { padding-left: 20px; }

    /* Buttons */
    button {
        padding: 8px 12px;
        cursor: pointer;
        border: 2px solid transparent;
        border-radius: 4px;
        font-size: 0.8em;
        font-weight: 500;
        background: linear-gradient(#7c3aed, #7c3aed) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
        color: #fff;
    }
    [data-theme="dark"] button {
        background: linear-gradient(#3b0764, #3b0764) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
    }
    .delete-button {
        background: linear-gradient(#7c3aed, #7c3aed) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
        color: white;
        margin-top: 10px;
    }
    [data-theme="dark"] .delete-button {
        background: linear-gradient(#3b0764, #3b0764) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
    }
    .story-button {
        background: linear-gradient(#0e7490, #0e7490) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
        color: white;
        margin-top: 10px;
    }
    [data-theme="dark"] .story-button {
        background: linear-gradient(#164e63, #164e63) padding-box,
                    linear-gradient(135deg, #06b6d4, #a855f7) border-box;
    }


    .section-header {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 15px 0 5px 0;
    }
    .section-header h4 {
        margin: 0;
        color: var(--text-heading);
        padding-bottom: 4px;
        font-size: 0.9em;
    }
    .listen-btn {
        background: none;
        border: none;
        padding: 0 4px;
        font-size: 0.85em;
        cursor: pointer;
        opacity: 0.5;
        color: var(--color-primary);
        line-height: 1;
    }
    .listen-btn:hover { opacity: 1; }

    .speak-btn {
        background: none;
        border: none;
        padding: 0 4px;
        font-size: 1em;
        cursor: pointer;
        line-height: 1;
        opacity: 0.55;
        flex-shrink: 0;
        color: var(--color-success);
    }
    .speak-btn:hover { opacity: 1; }

    .volume-control {
        position: relative;
    }
    #volumePopup {
        display: none;
        position: absolute;
        top: calc(100% + 8px);
        left: 50%;
        transform: translateX(-50%);
        background-color: var(--bg-card);
        border: 1px solid var(--border-card);
        border-radius: 8px;
        box-shadow: 0 4px 12px var(--shadow-card);
        padding: 12px 10px;
        z-index: 100;
    }
    #volumePopup.open { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    #volumeSlider {
        writing-mode: vertical-lr;
        direction: rtl;
        height: 90px;
        accent-color: var(--color-success);
        cursor: pointer;
    }
    #volumeLabel {
        font-size: 0.75em;
        color: var(--text-meta);
    }

    /* Responsive Design */
    @media (max-width: 650px) {
        body { padding: 10px; } /* Less padding on small screens */
        #wordGridContainer { flex-direction: column; }
        .grid-column { width:100%; }
    }

    /* Read Aloud Modal */
    .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.45);
        z-index: 2000;
        align-items: center;
        justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
        background-color: var(--bg-card);
        color: var(--text-primary);
        border: 1px solid var(--border-card);
        border-radius: 10px;
        box-shadow: 0 10px 30px var(--shadow-card);
        width: 90vw;
        height: 88vh;
        max-width: none;
        max-height: none;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }
    .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border-details);
    }
    .modal-header h3 { margin: 0; font-size: 1em; color: var(--text-heading); }
    .modal-close {
        background: none;
        border: none;
        color: var(--text-meta);
        font-size: 1.4em;
        line-height: 1;
        cursor: pointer;
        padding: 0 4px;
    }
    .modal-close:hover { color: var(--text-primary); }
    .modal-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 12px 16px 16px 16px;
    }
    .modal-actions .modal-left { display: flex; gap: 8px; }
    #storyModalBody { padding: 0; }
    .modal-header, .modal-actions { flex-shrink: 0; }
    .modal-tabs { display: flex; gap: 4px; padding: 10px 16px 0 16px; border-bottom: 1px solid var(--border-details); flex-shrink: 0; }
    .modal-tab { background: none; border: none; border-bottom: 2px solid transparent; padding: 8px 12px; cursor: pointer; color: var(--text-meta); font: inherit; font-size: 0.9em; }
    .modal-tab.active { color: var(--text-heading); border-bottom-color: var(--color-primary); }
    .modal-tab-panel { flex: 1 1 auto; overflow-y: auto; padding: 16px; }
    .story-word-chip { cursor: pointer; }
    .story-word-chip:hover { border-color: var(--color-primary); }
    mark.story-hl { background-color: #ffe066; color: inherit; border-radius: 3px; padding: 0 2px; }
    .story-meta { font-size: 0.75em; color: var(--text-meta); margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border-details); }
    .story-player { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--border-details); flex-shrink: 0; }
    .story-seek { flex: 1; min-width: 80px; }
    .story-time { font-size: 0.8em; color: var(--text-meta); white-space: nowrap; font-variant-numeric: tabular-nums; }
    .story-speed { font-size: 0.8em; color: var(--text-meta); display: flex; align-items: center; gap: 4px; }
    .story-speed select { padding: 4px 6px; border: 1px solid var(--border-input); border-radius: 4px; background-color: var(--bg-card); color: var(--text-primary); font: inherit; }

    /* --- Stories Panel --- */
    #storiesPanel { display: none; }
    .panel-section {
        background-color: var(--bg-card);
        border: 1px solid var(--border-card);
        border-radius: 10px;
        box-shadow: 0 2px 5px var(--shadow-card);
        padding: 18px;
        margin-bottom: 20px;
    }
    .panel-section h3 { margin: 0 0 14px 0; color: var(--text-heading); font-size: 1.05em; }
    .gen-filter { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .gen-filter select, .gen-filter input {
        padding: 7px 10px; border: 1px solid var(--border-input); border-radius: 4px;
        font-size: 0.8em; font-family: inherit; background-color: var(--bg-card); color: var(--text-primary);
        outline: none;
    }
    .gen-filter input { min-width: 90px; }
    .gen-filter select:focus, .gen-filter input:focus { border-color: var(--color-primary); }
    .filter-results {
        max-height: 220px; overflow-y: auto; border: 1px solid var(--border-card);
        border-radius: 6px; padding: 8px; background-color: var(--bg-editable); margin-bottom: 12px;
        display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 4px 12px;
    }
    .filter-item { display: flex; align-items: center; gap: 6px; font-size: 0.82em; cursor: pointer; padding: 2px 0; }
    .filter-item input { accent-color: var(--color-primary); }
    .filter-item .filter-meta { display: inline-flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
    .filter-item .filter-meta strong { color: var(--color-primary); min-width: 1.4em; }
    .filter-item .filter-sub { font-size: 0.82em; color: var(--text-meta); font-weight: 400; }
    .gen-selected { margin-bottom: 12px; font-size: 0.85em; }
    .gen-selected .sel-label { font-weight: 600; margin-right: 6px; color: var(--text-secondary); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chip {
        display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 14px;
        background: linear-gradient(#fff, #fff) padding-box, linear-gradient(135deg, #06b6d4, #a855f7) border-box;
        border: 2px solid transparent; color: #7c3aed; font-size: 0.78em; font-weight: 600;
    }
    [data-theme="dark"] .chip { background: linear-gradient(#1a0533, #1a0533) padding-box, linear-gradient(135deg, #06b6d4, #a855f7) border-box; color: #c084fc; }
    .chip.word-chip { cursor: pointer; }
    .chip.word-chip:hover { opacity: 0.8; }
    .gen-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .gen-actions input, .gen-actions select {
        box-sizing: border-box; padding: 7px 10px; border: 1px solid var(--border-input); border-radius: 4px;
        font-size: 0.8em; font-family: inherit; background-color: var(--bg-card); color: var(--text-primary); outline: none;
    }
    .gen-actions select:focus, .gen-actions input:focus { border-color: var(--color-primary); }
    #storyTitle { min-width: 160px; }
    #generateStoryBtn { flex-shrink: 0; }
    .model-ac { position: relative; flex: 0 1 340px; min-width: 200px; max-width: 360px; }
    .model-ac-input {
        box-sizing: border-box; width: 100%; padding: 7px 10px; border: 1px solid var(--border-input); border-radius: 4px;
        font-size: 0.8em; font-family: inherit; background-color: var(--bg-card); color: var(--text-primary); outline: none;
    }
    .model-ac-input:focus { border-color: var(--color-primary); }
    .model-ac-list {
        position: absolute; z-index: 50; top: calc(100% + 4px); left: 0; right: auto;
        min-width: 100%; width: 460px; max-width: 90vw;
        max-height: 280px; overflow-y: auto; border: 1px solid var(--border-input); border-radius: 6px;
        background-color: var(--bg-card); box-shadow: 0 8px 24px rgba(0,0,0,0.18); padding: 4px;
    }
    .model-ac-item {
        padding: 7px 9px; border-radius: 4px; font-size: 0.8em; cursor: pointer; color: var(--text-primary);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .model-ac-item.kb-active, .model-ac-item:hover { background-color: var(--bg-editable); }
    .model-ac-item.selected { font-weight: 600; color: var(--color-primary); }
    .gen-status { margin-top: 12px; padding: 10px 12px; border-radius: 6px; font-size: 0.9em;
        background-color: var(--bg-editable); color: var(--color-success); border: 1px solid var(--border-input); }
    .story-list-item { display: flex; justify-content: space-between; align-items: center; gap: 12px;
        padding: 10px 12px; border: 1px solid var(--border-input); border-radius: 6px;
        background-color: var(--bg-card); cursor: pointer; margin-bottom: 10px; }
    .story-list-item:hover { border-color: var(--color-primary); }
    .story-list-title { font-weight: 600; color: var(--text-heading); }
    .story-list-title-box { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .story-list-meta { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
    .story-list-meta-line { font-size: 0.72em; color: var(--text-meta); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .story-list-right { display: flex; align-items: center; gap: 10px; }
    .story-list-date { font-size: 0.8em; color: var(--text-meta); white-space: nowrap; }
    .story-list-del { background: none; border: none; color: var(--text-meta); cursor: pointer; font-size: 0.95em; padding: 4px 6px; border-radius: 4px; }
    .story-list-del:hover { color: #dc2626; background-color: rgba(220,38,38,0.1); }
    .story-card { margin-bottom: 16px; }
    .story-card .word-details { display: block; }

    /* In Stories view, hide the word-mode controls but keep the view toggle. */

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/turndown/dist/turndown.min.js"></script>

<script>
let currentlyEditing = null;
let toastTimer = null;
function showToast(msg) {
    const toast = document.getElementById('addWordToast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 5000);
}
const turndownService = new TurndownService();
let socket = null;
let currentSort = 'updatedAt';
let allWords = [];
let pendingAutoPlay = null;

async function addWord() {
  const input = document.getElementById('newWordInput');
  const btn = document.getElementById('addWordBtn');
  const word = input.value.trim();
  if (!word) return;

  btn.disabled = true;
  btn.textContent = '...';

  try {
    pendingAutoPlay = word;
    const res = await fetch('/api/word', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ word })
    });
    if (res.ok) {
      const data = await res.json();
      input.value = '';
      showToast(data.message);
      await fetchData(currentSort);
      autoPlayMeaning(word);
      pendingAutoPlay = null;
    } else {
      alert('Failed to add word');
    }
  } catch (e) {
    alert('Error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Add';
  }
}

function connectWebSocket() {
    const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
    const wsUrl = `${wsProtocol}//${window.location.host}/ws`;
    socket = new WebSocket(wsUrl);
    socket.onopen = () => console.log("WebSocket connection established.");
    socket.onmessage = async (event) => {
        if (event.data.startsWith("update_words")) {
            let wordToPlay = null;
            const colonIndex = event.data.indexOf(':');
            if (colonIndex !== -1) {
                const message = event.data.substring(colonIndex + 1);
                showToast(message);
                const match = message.match(/'([^']+)'/);
                if (match) wordToPlay = match[1];
            }
            await fetchData(currentSort);
            // Skip if this is the local tab's own word (already handled by addWord)
            if (wordToPlay && wordToPlay !== pendingAutoPlay) {
                autoPlayMeaning(wordToPlay);
            }
        } else if (event.data.startsWith("update_stories")) {
            const panel = document.getElementById('storiesPanel');
            if (panel.style.display !== 'none') {
                loadStories();
            }
            // Refresh word badges too (story links may have changed).
            fetch('/api/story_counts').then(r => r.json()).then(c => { wordStoryCounts = c; applySearch(); }).catch(() => {});
        }
    };
    socket.onclose = () => setTimeout(connectWebSocket, 5000);
    socket.onerror = (error) => console.error("WebSocket error:", error);
}

async function saveCellChanges(cell) {
  if (!cell.hasAttribute('contenteditable') || currentlyEditing !== cell) {
    if (currentlyEditing === cell) currentlyEditing = null; return;
  }
  cell.removeAttribute('contenteditable');
  const originalCurrentlyEditing = currentlyEditing;
  currentlyEditing = null;
  const wordItem = cell.closest('.word-item');
  const id = parseInt(wordItem.dataset.id);
  const word = wordItem.dataset.word;
  const encounters = parseInt(wordItem.dataset.encounters);
  const meaningDiv = wordItem.querySelector('.meaning-content');
  const examplesDiv = wordItem.querySelector('.examples-content');
  const synonymsDiv = wordItem.querySelector('.synonyms-content');
  const editedMarkdownValue = cell.innerText.trim();
  let meaningMarkdown = (cell === meaningDiv) ? editedMarkdownValue : (meaningDiv.dataset.raw || '');
  let examplesMarkdown = (cell === examplesDiv) ? editedMarkdownValue : (examplesDiv.dataset.raw || '');
  let synonymsMarkdown = (cell === synonymsDiv) ? editedMarkdownValue : (synonymsDiv.dataset.raw || '');
  try {
    const response = await fetch('/api/words', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, word, meaning: meaningMarkdown, sentences: examplesMarkdown, synonyms: synonymsMarkdown, encounters })
    });
    if (!response.ok) throw new Error(`Update failed: ${response.status} ${await response.text()}`);
    cell.dataset.raw = editedMarkdownValue;
    cell.innerHTML = `<div class="rendered">${marked.parse(editedMarkdownValue || "")}</div>`;
  } catch (err) {
    console.error('Update failed on client:', err);
    alert(`Failed to save changes: ${err.message}`);
    const originalRaw = originalCurrentlyEditing.dataset.raw || '';
    originalCurrentlyEditing.innerHTML = `<div class="rendered">${marked.parse(originalRaw)}</div>`;
    originalCurrentlyEditing.removeAttribute('contenteditable');
  }
}

function makeEditable(cell) {
  if (currentlyEditing) { alert("Another cell is already being edited."); return; }
  currentlyEditing = cell;
  const rawMarkdown = cell.dataset.raw || "";
  cell.innerText = rawMarkdown;
  cell.setAttribute('contenteditable', 'true');
  cell.focus();
  const range = document.createRange();
  range.selectNodeContents(cell);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  cell.onpaste = (e) => {
    e.preventDefault();
    const html = e.clipboardData.getData('text/html');
    const plain = e.clipboardData.getData('text/plain');
    let markdownToInsert = plain;
    if (html) { try { markdownToInsert = turndownService.turndown(html); } catch (tdError) { console.error("Turndown error:", tdError); } }
    document.execCommand('insertText', false, markdownToInsert);
  };
  cell.onkeydown = async (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); await saveCellChanges(cell); }
    else if (e.key === 'Escape') {
      e.preventDefault();
      cell.removeAttribute('contenteditable');
      const originalRaw = cell.dataset.raw || '';
      cell.innerHTML = `<div class="rendered">${marked.parse(originalRaw)}</div>`;
      currentlyEditing = null;
    }
  };
  cell.onblur = () => { setTimeout(async () => { if (cell.hasAttribute('contenteditable') && currentlyEditing === cell) { await saveCellChanges(cell); } else if (currentlyEditing === cell) { currentlyEditing = null; } }, 100); };
}

function stripMarkdown(md) {
    return md
        .replace(/#{1,6}\s+/g, '')
        .replace(/\*\*_(.+?)_\*\*/g, '$1')
        .replace(/___(.+?)___/g, '$1')
        .replace(/\*\*\*(.+?)\*\*\*/g, '$1')
        .replace(/\*\*(.+?)\*\*/g, '$1')
        .replace(/__(.+?)__/g, '$1')
        .replace(/\*(.+?)\*/g, '$1')
        .replace(/_(.+?)_/g, '$1')
        .replace(/`(.+?)`/g, '$1')
        .replace(/\[(.+?)\]\(.+?\)/g, '$1')
        .replace(/^[-*+]\s+/gm, '')
        .replace(/^\d+\.\s+/gm, '')
        .trim();
}

let currentAudio = null;
let currentBtn = null;
const ttsCache = new Map();      // text -> object URL (in-memory audio cache)
const TTS_CACHE_MAX = 100;

function stopAudio() {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    if (currentBtn) { currentBtn.innerHTML = currentBtn.dataset.icon; currentBtn = null; }
}

async function playTTS(text, btn) {
    if (btn && currentBtn === btn) { stopAudio(); return; }
    stopAudio();
    if (btn) { btn.innerHTML = '<i class="fa-solid fa-circle-stop"></i>'; currentBtn = btn; }
    const volume = parseFloat(document.getElementById('volumeSlider').value);
    try {
        let url;
        if (ttsCache.has(text)) {
            url = ttsCache.get(text);
        } else {
            const res = await fetch('/api/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            if (!res.ok) throw new Error('TTS failed');
            const blob = await res.blob();
            url = URL.createObjectURL(blob);
            ttsCache.set(text, url);
            if (ttsCache.size > TTS_CACHE_MAX) {
                const oldest = ttsCache.keys().next().value;
                URL.revokeObjectURL(ttsCache.get(oldest));
                ttsCache.delete(oldest);
            }
        }
        const audio = new Audio(url);
        audio.volume = volume;
        currentAudio = audio;
        audio.play();
        audio.onended = () => { if (btn && currentBtn === btn) stopAudio(); };
    } catch (e) {
        console.error('TTS error:', e);
        if (btn && currentBtn === btn) stopAudio();
    }
}

function autoPlayMeaning(wordName) {
    if (!wordName) return;
    const item = allWords.find(w => w.word === wordName);
    if (!item || !item.meaning) return;
    const text = stripMarkdown(item.meaning);
    if (!text) return;
    stopAudio();
    playTTS(text, null);
}

function pronounceWord(btn, event) {
    event.stopPropagation();
    const word = btn.closest('.word-item').dataset.word;
    playTTS(word, btn);
}

function speakSection(btn, event) {
    event.stopPropagation();
    const content = btn.closest('.detail-section').querySelector('.editable-content');
    const text = stripMarkdown(content.dataset.raw || '');
    if (!text) return;
    playTTS(text, btn);
}

function deleteItem(button) {
  const wordItem = button.closest('.word-item');
  const id = wordItem.dataset.id;
  const word = wordItem.dataset.word;
  if (confirm(`Are you sure you want to delete "${word}" (ID ${id})?`)) {
    fetch(`/api/words/${id}`, { method: 'DELETE' })
    .then(response => { if (!response.ok) response.text().then(text => alert(`Failed to delete word: ${text}`)); })
    .catch(err => alert(`Error while deleting word: ${err.message}`));
  }
}

function renderGrid(data) {
  const container = document.getElementById('wordGridContainer');
  if (currentlyEditing) {
    console.log("Skipping render because a cell is being edited.");
    return;
  }
  const total = allWords.length;
  const filtered = data.length;
  const countEl = document.getElementById('wordCount');
  countEl.textContent = (filtered < total && total > 0)
    ? `${filtered} / ${total} words`
    : `${total} word${total !== 1 ? 's' : ''}`;
  container.innerHTML = '';
  const numColumns = 3;
  let columns = [];
  var dateOptions = {
    timeZone: 'America/Lima',
    year: 'numeric',
    month: '2-digit',
    day: '2-digit',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: false, // change to true if you prefer AM/PM
  }
  for (let i = 0; i < numColumns; i++) {
    const columnDiv = document.createElement('div');
    columnDiv.className = 'grid-column';
    container.appendChild(columnDiv);
    columns.push(columnDiv);
  }
  const columnHTMLs = Array(numColumns).fill('');
  data.forEach((item, index) => {
    const wordItemHTML = `
      <div class="word-item"
           data-id="${item.id}"
           data-word="${item.word}"
           data-encounters="${item.encounters}"
           data-meaning="${encodeURIComponent(item.meaning || '')}"
           data-sentences="${encodeURIComponent(item.sentences || '')}"
           data-synonyms="${encodeURIComponent(item.synonyms || '')}"
           data-createdat="${item.createdAt || ''}"
           data-updatedat="${item.updatedAt || ''}">
        <div class="word-header">
          <button class="speak-btn" data-icon='<i class="fa-solid fa-headphones"></i>' onclick="pronounceWord(this, event)" title="Pronounce"><i class="fa-solid fa-headphones"></i></button>
          <span class="word-title">${item.word}</span>
          <span class="freq-badge">${item.encounters}</span>
          <span class="indicator">+</span>
        </div>
        <div class="word-details"></div>
      </div>
    `;
    columnHTMLs[index % numColumns] += wordItemHTML;
  });
  columns.forEach((col, i) => col.innerHTML = columnHTMLs[i]);
  container.querySelectorAll('.word-header').forEach(header => {
      header.querySelector('.word-title').addEventListener('click', e => e.stopPropagation());
      header.addEventListener('click', () => {
          const wordItem = header.closest('.word-item');
          const details = header.nextElementSibling;
          const indicator = header.querySelector('.indicator');
          const isVisible = details.style.display === 'block';
          if (!isVisible && !details.dataset.rendered) {
              const meaningMarkdown = decodeURIComponent(wordItem.dataset.meaning || '');
              const sentencesMarkdown = decodeURIComponent(wordItem.dataset.sentences || '');
              const synonymsMarkdown = decodeURIComponent(wordItem.dataset.synonyms || '');
              const escAttr = s => s.replace(/"/g, '&quot;');
              const createdAt = wordItem.dataset.createdat || '';
              const updatedAt = wordItem.dataset.updatedat || '';
              const createdDate = createdAt ? new Date(createdAt.replace(' ', 'T') + 'Z').toLocaleString('en-US', dateOptions) : 'N/A';
              const updatedDate = updatedAt ? new Date(updatedAt.replace(' ', 'T') + 'Z').toLocaleString('en-US', dateOptions) : 'N/A';
              details.innerHTML = `
                <div class="detail-section">
                    <div class="section-header">
                        <h4>Meaning</h4>
                        <button class="listen-btn" data-icon='<i class="fa-solid fa-headphones"></i>' onclick="speakSection(this, event)" title="Listen to meaning"><i class="fa-solid fa-headphones"></i></button>
                    </div>
                    <div class="editable-content meaning-content" data-raw="${escAttr(meaningMarkdown)}" ondblclick="makeEditable(this)">
                         <div class="rendered">${marked.parse(meaningMarkdown)}</div>
                    </div>
                </div>
                <div class="detail-section">
                    <div class="section-header">
                        <h4>Synonyms</h4>
                        <button class="listen-btn" data-icon='<i class="fa-solid fa-headphones"></i>' onclick="speakSection(this, event)" title="Listen to synonyms"><i class="fa-solid fa-headphones"></i></button>
                    </div>
                    <div class="editable-content synonyms-content" data-raw="${escAttr(synonymsMarkdown)}" ondblclick="makeEditable(this)">
                         <div class="rendered">${marked.parse(synonymsMarkdown)}</div>
                    </div>
                </div>
                <div class="detail-section">
                    <div class="section-header">
                        <h4>Examples</h4>
                        <button class="listen-btn" data-icon='<i class="fa-solid fa-headphones"></i>' onclick="speakSection(this, event)" title="Listen to examples"><i class="fa-solid fa-headphones"></i></button>
                    </div>
                    <div class="editable-content examples-content" data-raw="${escAttr(sentencesMarkdown)}" ondblclick="makeEditable(this)">
                         <div class="rendered">${marked.parse(sentencesMarkdown)}</div>
                    </div>
                </div>
                <div class="detail-section">
                    <h4>Metadata</h4>
                    <div class="metadata">
                        ID: ${wordItem.dataset.id} | Created: ${createdDate} | Updated: ${updatedDate}
                    </div>
                </div>
                <button class="story-button" data-id="${wordItem.dataset.id}" title="View stories for this word"><i class="fa-solid fa-book"></i> Stories${wordStoryCounts[wordItem.dataset.id] ? ` (${wordStoryCounts[wordItem.dataset.id]})` : ''}</button>
                <button class="delete-button" onclick="deleteItem(this)"><i class="fa-solid fa-trash-can"></i> Delete Word</button>
              `;
              details.dataset.rendered = 'true';
          }
          details.style.display = isVisible ? 'none' : 'block';
          indicator.innerHTML = isVisible ? '+' : '−';
      });
  });
}

function applySearch() {
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const filtered = query ? allWords.filter(w => w.word.toLowerCase().includes(query)) : allWords;
  renderGrid(filtered);
}

function fetchData(sortBy = 'updatedAt') {
  if (currentlyEditing) {
    console.log("Skipping fetch because a cell is being edited.");
    return Promise.resolve();
  }
  currentSort = sortBy;
  console.log(`Fetching data, sorting by: ${sortBy}`);
  return fetch(`/api/words?sort_by=${sortBy}`)
    .then(res => {
      if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
      return res.json();
    })
    .then(data => {
        console.log("Data received, rendering grid:", data.length, "items");
        allWords = data;
        return fetch('/api/story_counts')
            .then(r => r.json())
            .then(c => { wordStoryCounts = c; })
            .catch(() => {});
    })
    .then(() => applySearch())
    .catch(err => console.error('Fetch error:', err));
}

async function copyTopWordsCSV() {
    if (!allWords.length) { showToast('No words to copy'); return; }
    const raw = parseInt(document.getElementById('csvLimitInput').value, 10);
    const limit = Math.max(1, isNaN(raw) ? allWords.length : raw);
    const topWords = allWords.slice(0, limit).map(w => w.word);
    const csv = ['word', ...topWords].join('\n');
    try {
        if (navigator.clipboard && window.isSecureContext) {
            await navigator.clipboard.writeText(csv);
        } else {
            const ta = document.createElement('textarea');
            ta.value = csv;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
        }
        showToast(`Copied ${topWords.length} word${topWords.length !== 1 ? 's' : ''} as CSV`);
    } catch (e) {
        console.error('Clipboard copy failed:', e);
        alert('Failed to copy to clipboard: ' + e.message);
    }
}

// --- Story modal ---
let currentModalStoryId = null;

function formatDate(ts) {
  if (!ts) return '';
  const d = new Date(String(ts).replace(' ', 'T') + 'Z');
  if (isNaN(d.getTime())) return ts;
  return d.toLocaleString();
}

function formatDuration(ms) {
  if (ms == null || isNaN(ms)) return '';
  const totalSec = Math.round(ms / 1000);
  const m = Math.floor(totalSec / 60);
  const s = totalSec % 60;
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function stripStoryLabels(text) {
  if (!text) return '';
  let t = text.replace(/^\s*Title:\s*[^\n]*/i, '');
  t = t.replace(/^\s*Story:\s*/i, '');
  return t.trim();
}

async function openStoryModal(id) {
  currentModalStoryId = id;
  stopAudio();
  hideStoryPlayer();
  try {
    const res = await fetch(`/api/stories/${id}`);
    if (!res.ok) return;
    const s = await res.json();
    document.getElementById('storyModalTitle').textContent = s.title || 'Untitled';
    document.getElementById('storyModalBody').innerHTML = `<div class="rendered">${marked.parse(stripStoryLabels(s.content || ''))}</div>`;
    const metaEl = document.getElementById('storyModalMeta');
    const metaParts = [];
    if (s.model) metaParts.push(s.model.replace(/^.*\//, ''));

function formatTime(sec) {
  if (!sec || isNaN(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return `${m}:${s}`;
}

function clearStoryHighlights() {
  document.querySelectorAll('#storyModalBody mark.story-hl').forEach(m => {
    const parent = m.parentNode;
    if (!parent) return;
    parent.replaceChild(document.createTextNode(m.textContent), m);
    parent.normalize();
  });
}

function highlightWordInStory(word) {
  clearStoryHighlights();
  const body = document.getElementById('storyModalBody');
  if (!body || !word) return;
  const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('\\b(' + escaped + ')\\b', 'gi');
  const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, null);
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) nodes.push(n);
  let firstMark = null;
  nodes.forEach(node => {
    const text = node.nodeValue;
    re.lastIndex = 0;
    let m, last = 0, matched = false;
    const frag = document.createDocumentFragment();
    while ((m = re.exec(text)) !== null) {
      matched = true;
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const mark = document.createElement('mark');
      mark.className = 'story-hl';
      mark.textContent = m[0];
      frag.appendChild(mark);
      if (!firstMark) firstMark = mark;
      last = m.index + m[0].length;
    }
    if (matched) {
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    }
  });
  if (firstMark) firstMark.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

async function applyFilter() {
  const field = document.getElementById('filterField').value;
  const direction = document.getElementById('filterDirection').value;
  const min = document.getElementById('filterMin').value.trim();
  const max = document.getElementById('filterMax').value.trim();
  const qs = new URLSearchParams({ field, direction });
  if (min) qs.set('min', min);
  if (max) qs.set('max', max);
  const res = await fetch(`/api/words/filter?${qs}`);
  const data = await res.json();
  renderFilterResults(data);
}

function renderFilterResults(data) {
  const box = document.getElementById('filterResults');
  box.innerHTML = '';
  if (!data.length) {
    box.innerHTML = '<span style="font-size:0.8em;color:var(--text-meta);">No words match this filter.</span>';
    return;
  }
  // Absolute position is tied to the from/to config (1-based).
  const minRaw = document.getElementById('filterMin').value.trim();
  const start = minRaw ? Math.max(1, parseInt(minRaw, 10) || 1) : 1;
  data.forEach((w, idx) => {
    const pos = start + idx;
    const label = document.createElement('label');
    label.className = 'filter-item';
    label.dataset.word = w.word;
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = selectedWords.has(w.word);
    cb.addEventListener('change', () => {
      if (cb.checked) selectedWords.add(w.word); else selectedWords.delete(w.word);
      renderChips();
    });
    const meta = document.createElement('span');
    meta.className = 'filter-meta';
    const updated = (w.updatedAt || w.createdAt || '').split(' ')[0];
    meta.innerHTML = `<strong>${pos}.</strong> ${w.word} <span class="filter-sub">enc: ${w.encounters} · ${updated}</span>`;
    label.appendChild(cb);
    label.appendChild(meta);
    box.appendChild(label);
  });
}

function renderChips() {
  const box = document.getElementById('selectedChips');
  box.innerHTML = '';
  document.getElementById('selCount').textContent = selectedWords.size;
  selectedWords.forEach(word => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.textContent = word + ' ×';
    chip.title = 'Remove';
    chip.onclick = () => {
      selectedWords.delete(word);
      // uncheck in results if visible
      document.querySelectorAll('#filterResults .filter-item').forEach(li => {
        if (li.textContent.trim().replace('×','').trim().endsWith(word) || li.textContent.includes(word)) {}
      });
      renderFilterResultsFromDom();
      renderChips();
    };
    box.appendChild(chip);
  });
}

// Re-render result checkboxes to reflect current selection (after chip removal).
function renderFilterResultsFromDom() {
  document.querySelectorAll('#filterResults .filter-item').forEach(li => {
    li.querySelector('input').checked = selectedWords.has(li.dataset.word);
  });
}

async function populateModelSelect() {
  let apiList = [];
  // Best-effort live refresh from OpenRouter's public models list (free + paid).
  try {
    const res = await fetch('https://openrouter.ai/api/v1/models', { headers: { 'Accept': 'application/json' } });
    if (res.ok) {
      const data = await res.json();
      apiList = data.data || [];
    }
  } catch (e) { /* offline: keep curated list */ }

  ALL_MODELS = buildModelMaster(STATIC_MODELS, apiList);
  restoreStoryModel();
}

// Build the master list of selectable models from curated + live API, with price tags.
function buildModelMaster(staticList, apiList) {
  const seen = new Set();
  const out = [];
  staticList.forEach(m => {
    seen.add(m.id);
    out.push(makeModel(m.id, m.name, m.pIn || 0, m.pOut || 0, m.rec));
  });
  (apiList || []).forEach(m => {
    if (!seen.has(m.id)) {
      seen.add(m.id);
      const p = m.pricing || {};
      const pIn = parseFloat(p.prompt || '0') * 1e6;
      const pOut = parseFloat(p.completion || '0') * 1e6;
      out.push(makeModel(m.id, m.name || m.id, pIn, pOut, false));
    }
  });
  // Cheapest first (free = 0).
  return out.sort((a, b) => a.price - b.price);
}

// Normalize a model entry into { id, label, price } with a human-readable price tag.
function makeModel(id, name, pIn, pOut, rec) {
  const free = pIn <= 0 && pOut <= 0;
  const tags = [];
  if (free) tags.push('free'); else tags.push('paid');
  if (rec) tags.push('recommended');
  let label = name;
  if (tags.length) label += ` (${tags.join(', ')})`;
  if (!free) label += ` · $${pIn.toFixed(3)}/$${pOut.toFixed(3)} per 1M`;
  return { id, label, price: pIn + pOut };
}

// Render the autocomplete dropdown filtered by query.
function renderModelAC(query) {

  ).slice(0, 60);

  list.innerHTML = '';

      list.querySelectorAll('.model-ac-item').forEach(x => x.classList.remove('kb-active'));
      div.classList.add('kb-active');
    });

function selectModelAC(id) {
  storyModelSelection = id;
  localStorage.setItem('lastStoryModel', id);
  const custom = document.getElementById('storyModelCustom');
  if (id === '__custom__') {
    custom.value = localStorage.getItem('lastStoryModelCustom') || '';
    custom.style.display = '';
  } else {
    custom.style.display = 'none';
  }
  syncModelInputToSelection();
  document.getElementById('storyModelList').style.display = 'none';
}

function syncModelInputToSelection() {
  const input = document.getElementById('storyModelInput');
  const custom = document.getElementById('storyModelCustom');
  if (storyModelSelection === '__custom__') {
    input.value = 'Custom…';
    custom.style.display = '';
  } else if (storyModelSelection === '') {
    input.value = 'Default model';
    custom.style.display = 'none';
  } else {
    const m = ALL_MODELS.find(x => x.id === storyModelSelection);
    input.value = m ? m.label : storyModelSelection;
    custom.style.display = 'none';
  }
}

function resolveStoryModel() {
  if (storyModelSelection === '__custom__') {
    return document.getElementById('storyModelCustom').value.trim() || null;
  }
  return storyModelSelection || null;
}

function restoreStoryModel() {
  const saved = localStorage.getItem('lastStoryModel');
  if (saved) storyModelSelection = saved;
  if (storyModelSelection === '__custom__') {
    document.getElementById('storyModelCustom').value = localStorage.getItem('lastStoryModelCustom') || '';
  }
  syncModelInputToSelection();
}

async function generateStory() {
  const words = Array.from(selectedWords);
  if (!words.length) { showToast('Select at least one word first'); return; }
  const btn = document.getElementById('generateStoryBtn');
  const status = document.getElementById('genStatus');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Generating...';
  status.style.display = 'none';
  try {
    const res = await fetch('/api/story', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        words,
        title: document.getElementById('storyTitle').value.trim() || null,
        model: resolveStoryModel()
      })
    });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      throw new Error(e.detail || 'Failed to generate story');
    }
    const story = await res.json();
    currentStoryId = story.id;
    status.style.display = 'block';
    const parts = [];
    const dur = formatDuration(story.duration_ms);
    if (dur) parts.push(dur);
    if (story.cost != null) parts.push(story.cost > 0 ? `$${story.cost.toFixed(5)}` : 'free');
    const meta = parts.length ? ` (${parts.join(' · ')})` : '';
    status.textContent = `Story generated and saved: "${story.title}"${meta}. Find it in Saved Stories below.`;
    loadStories();
    document.getElementById('storiesList').scrollIntoView({ behavior: 'smooth' });
  } catch (e) {
    alert('Error: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Generate Story';
  }
}

async function readStoryById(id, btn) {
  if (!btn) return;
  if (currentBtn === btn) { stopAudio(); hideStoryPlayer(); return; }
  const icon = btn.dataset.icon || btn.innerHTML;
  btn.dataset.icon = icon;
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Loading audio...';
  try {
    const res = await fetch(`/api/stories/${id}`);
    const story = await res.json();
    let filename = story.audio_path;
    if (!filename) {
      const saveRes = await fetch('/api/tts/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: stripMarkdown(stripStoryLabels(story.content)), story_id: id })
      });
      if (!saveRes.ok) throw new Error('TTS failed');
      ({ filename } = await saveRes.json());
    }
    btn.disabled = false;
    playAudioFile('/audio/' + filename, btn, () => { loadStories(); hideStoryPlayer(); });
    showStoryPlayer();
    const audio = currentAudio;
    if (audio) {
      audio.playbackRate = parseFloat(document.getElementById('storyModalSpeed').value) || 1;
      const tick = () => {
        const seek = document.getElementById('storyModalSeek');
        const dur = audio.duration || 0;
        seek.max = dur;
        seek.value = audio.currentTime || 0;
        document.getElementById('storyModalTime').textContent = `${formatTime(audio.currentTime)} / ${formatTime(dur)}`;
      };
      audio.ontimeupdate = tick;
      audio.onloadedmetadata = tick;
      audio.onplay = () => { document.getElementById('storyModalPlayPause').innerHTML = '<i class="fa-solid fa-pause"></i>'; };
      audio.onpause = () => { document.getElementById('storyModalPlayPause').innerHTML = '<i class="fa-solid fa-play"></i>'; };
    }
  } catch (e) {
    btn.disabled = false;
    btn.innerHTML = icon;
    alert('TTS error: ' + e.message);
  }
}

async function playAudioFile(url, btn, onEnd) {
  stopAudio();
  const volume = parseFloat(document.getElementById('volumeSlider').value);
  const audio = new Audio(url);
  audio.volume = volume;
  currentAudio = audio;
  if (btn) { btn.innerHTML = '<i class="fa-solid fa-circle-stop"></i>'; currentBtn = btn; }
  audio.play();
  audio.onended = () => { if (!btn || currentBtn === btn) { stopAudio(); if (onEnd) onEnd(); } };
}

async function deleteStory(id) {
  if (!confirm('Delete this story? This also removes its saved audio.')) return;
  await fetch(`/api/stories/${id}`, { method: 'DELETE' });
  if (currentStoryId === id) {
    currentStoryId = null;
  }
  loadStories();
}

async function loadStories(wordId) {
  let url = '/api/stories';
  if (wordId) url += `?word_id=${wordId}`;
  const res = await fetch(url);
  const stories = await res.json();
  const box = document.getElementById('storiesList');
  box.innerHTML = '';
  if (!stories.length) {
    box.innerHTML = '<p style="color:var(--text-meta);font-size:0.85em;">No stories yet. Use the generator above to create one.</p>';
    return;
  }
  stories.forEach(s => {
    const item = document.createElement('div');
    item.className = 'story-list-item';
    item.dataset.id = s.id;
    const titleBox = document.createElement('span');
    titleBox.className = 'story-list-title-box';
    const title = document.createElement('span');
    title.className = 'story-list-title';
    title.textContent = s.title || 'Untitled';
    titleBox.appendChild(title);
    if (s.model || s.cost != null || s.duration_ms != null) {
      const metaBox = document.createElement('span');
      metaBox.className = 'story-list-meta';
      const add = (text) => {
        const span = document.createElement('span');
        span.className = 'story-list-meta-line';
        span.textContent = text;
        metaBox.appendChild(span);
      };
      if (s.model) add(s.model.replace(/^.*\//, ''));
      if (s.cost != null) add(s.cost > 0 ? `$${s.cost.toFixed(5)}` : 'free');
      const dur = formatDuration(s.duration_ms);
      if (dur) add(dur);
      titleBox.appendChild(metaBox);
    }
    const right = document.createElement('span');
    right.className = 'story-list-right';
    const date = document.createElement('span');
    date.className = 'story-list-date';
    date.textContent = formatDate(s.createdAt);
    const del = document.createElement('button');
    del.className = 'story-list-del';
    del.title = 'Delete story';
    del.innerHTML = '<i class="fa-solid fa-trash-can"></i>';
    del.onclick = (e) => { e.stopPropagation(); deleteStory(s.id); };
    right.appendChild(date);
    right.appendChild(del);
    item.appendChild(titleBox);
    item.appendChild(right);
    item.onclick = () => openStoryModal(s.id);
    box.appendChild(item);
  });
}

    document.getElementById('viewToggleBtn').addEventListener('click', () => {
        const panel = document.getElementById('storiesPanel');
        const grid = document.getElementById('wordGridContainer');
        const btn = document.getElementById('viewToggleBtn');
        if (panel.style.display === 'none' || panel.style.display === '') {
            panel.style.display = 'block';
            grid.style.display = 'none';
            document.body.classList.add('stories-view');
            btn.innerHTML = '<i class="fa-solid fa-book"></i> Words';
            loadStories();
            populateModelSelect();
        } else {
            panel.style.display = 'none';
            grid.style.display = '';
            document.body.classList.remove('stories-view');
            btn.innerHTML = '<i class="fa-solid fa-book-open"></i> Stories';
        }
    });
    document.getElementById('applyFilterBtn').addEventListener('click', applyFilter);
    document.getElementById('storyModelCustom').addEventListener('input', (e) => {
        localStorage.setItem('lastStoryModelCustom', e.target.value.trim());
    });
    const acInput = document.getElementById('storyModelInput');
    acInput.addEventListener('focus', () => { acInput.select(); renderModelAC(''); });
    acInput.addEventListener('input', () => renderModelAC(acInput.value));
    acInput.addEventListener('blur', () => {
        setTimeout(() => {
            document.getElementById('storyModelList').style.display = 'none';
            syncModelInputToSelection();
        }, 150);
    });
    acInput.addEventListener('keydown', (e) => {
        const list = document.getElementById('storyModelList');
        const items = Array.from(list.querySelectorAll('.model-ac-item'));
        let active = items.findIndex(i => i.classList.contains('kb-active'));
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            if (list.style.display === 'none') { renderModelAC(acInput.value); return; }
            const next = (active + 1) % items.length;
            items.forEach(i => i.classList.remove('kb-active'));
            items[next].classList.add('kb-active');
            acInput.value = items[next].textContent;
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            const prev = (active <= 0 ? items.length - 1 : active - 1);
            items.forEach(i => i.classList.remove('kb-active'));
            items[prev].classList.add('kb-active');
            acInput.value = items[prev].textContent;
        } else if (e.key === 'Enter') {
            if (list.style.display !== 'none' && items.length) {
                e.preventDefault();
                selectModelAC((active >= 0 ? items[active] : items[0]).dataset.id);
            }
        } else if (e.key === 'Escape') {
            list.style.display = 'none';
            syncModelInputToSelection();
        }
    });
    populateModelSelect();
    document.getElementById('selectAllBtn').addEventListener('click', () => {
        document.querySelectorAll('#filterResults .filter-item').forEach(li => {
            selectedWords.add(li.dataset.word);
            li.querySelector('input').checked = true;
        });
        renderChips();
    });
    document.getElementById('clearSelBtn').addEventListener('click', () => {
        selectedWords.clear();
        renderFilterResultsFromDom();
        renderChips();
    });
    document.getElementById('generateStoryBtn').addEventListener('click', generateStory);

    // Story button on word cards -> open Stories panel filtered by that word.
    document.getElementById('wordGridContainer').addEventListener('click', (e) => {
        const btn = e.target.closest('.story-button');
        if (btn) openStoriesForWord(parseInt(btn.dataset.id));
    });

    fetchData(currentSort);
    connectWebSocket();
});
</script>

</body>
</html>
